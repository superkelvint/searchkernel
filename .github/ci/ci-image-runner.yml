# NOTE: This file is intentionally outside .github/workflows.
# GitHub Actions does not register it as a workflow. It is retained as
# structural/reference data for verifier and CI-policy tests.

name: Search Kernel CI image runner

on:
  workflow_call:
    inputs:
      revision:
        description: Exact Search Kernel revision to execute
        required: true
        type: string
      target:
        description: Named CI lane to execute inside the immutable image
        required: true
        type: string
      baseline_sha:
        description: Optional baseline revision for ABI comparisons
        required: false
        default: ""
        type: string
      head_ref:
        description: Optional source branch for guarded autofix pushes
        required: false
        default: ""
        type: string
    secrets:
      autofix_token:
        required: false
  workflow_dispatch:
    inputs:
      revision:
        description: Branch, tag, or commit to execute
        required: false
        type: string
      target:
        description: Named CI lane
        required: true
        default: rust-non-native
        type: string
      baseline_sha:
        description: Optional baseline revision for ABI comparisons
        required: false
        default: ""
        type: string
      head_ref:
        description: Optional source branch for guarded autofix pushes
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-image-${{ github.repository }}-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.target }} in searchkernel-ci
    runs-on: [self-hosted, linux, x64]
    env:
      CI_IMAGE: docker.io/superkelvint/searchkernel-ci:latest
    steps:
      - name: Allocate job-private checkout path
        id: checkout
        env:
          CI_TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$CI_TARGET" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::invalid CI target for checkout path: $CI_TARGET"
            exit 1
          fi

          relative=".ci-checkouts/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${CI_TARGET}"
          absolute="$GITHUB_WORKSPACE/$relative"
          if [[ -e "$absolute" ]]; then
            echo "::error::job-private checkout path already exists: $absolute"
            exit 1
          fi

          echo "relative=$relative" >> "$GITHUB_OUTPUT"
          echo "absolute=$absolute" >> "$GITHUB_OUTPUT"

      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          path: ${{ steps.checkout.outputs.relative }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact revision
        id: revision
        shell: bash
        working-directory: ${{ steps.checkout.outputs.absolute }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "Executing exact Search Kernel revision $actual"

      - name: Pull immutable CI image
        shell: bash
        working-directory: ${{ steps.checkout.outputs.absolute }}
        run: |
          set -euo pipefail
          docker pull "$CI_IMAGE"

          vespa_commit=$(docker image inspect --format '{{index .Config.Labels "io.searchkernel.vespa-commit"}}' "$CI_IMAGE")
          vespa_bundle=$(docker image inspect --format '{{index .Config.Labels "io.searchkernel.vespa-bundle-id"}}' "$CI_IMAGE")
          vespa_ref=$(docker image inspect --format '{{index .Config.Labels "io.searchkernel.vespa-image-digest"}}' "$CI_IMAGE")
          [[ -n "$vespa_commit" && "$vespa_commit" != "<no value>" ]] || {
            echo "::error::CI image is missing io.searchkernel.vespa-commit label"
            exit 1
          }
          if [[ "$vespa_ref" != *@sha256:* ]]; then
            legacy_vespa_tag="docker.io/superkelvint/searchkernel-ci-vespa:$vespa_commit-$vespa_bundle"
            echo "::notice::CI image predates external Vespa digest labels; resolving $legacy_vespa_tag"
            docker pull "$legacy_vespa_tag"
            vespa_ref=$(docker image inspect --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{end}}' "$legacy_vespa_tag")
          else
            docker pull "$vespa_ref"
          fi
          [[ "$vespa_ref" == *@sha256:* ]] || {
            echo "::error::could not resolve immutable Vespa image digest"
            exit 1
          }
          actual_vespa_commit=$(docker image inspect --format '{{index .Config.Labels "io.searchkernel.vespa-commit"}}' "$vespa_ref")
          actual_vespa_bundle=$(docker image inspect --format '{{index .Config.Labels "io.searchkernel.vespa-bundle-id"}}' "$vespa_ref")
          [[ "$actual_vespa_commit" == "$vespa_commit" ]] || {
            echo "::error::CI/Vespa commit provenance mismatch"
            exit 1
          }
          [[ "$actual_vespa_bundle" == "$vespa_bundle" ]] || {
            echo "::error::CI/Vespa bundle provenance mismatch"
            exit 1
          }

          digest=$(docker image inspect --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{end}}' "$CI_IMAGE")
          image_id=$(docker image inspect --format '{{.Id}}' "$CI_IMAGE")
          [[ -n "$image_id" ]] || {
            echo "::error::could not resolve immutable image ID for $CI_IMAGE"
            exit 1
          }

          echo "CI IMAGE PROVENANCE"
          printf '  ref:          %s\n' "$CI_IMAGE"
          printf '  digest:       %s\n' "${digest:-unknown}"
          printf '  image_id:     %s\n' "$image_id"
          printf '  vespa_commit: %s\n' "$vespa_commit"
          printf '  vespa_image:  %s\n' "$vespa_ref"

          {
            echo "CI_IMAGE_ID=$image_id"
            echo "CI_VESPA_IMAGE_REF=$vespa_ref"
            echo "CI_VESPA_COMMIT=$vespa_commit"
            echo "CI_VESPA_BUNDLE_ID=$vespa_bundle"
          } >> "$GITHUB_ENV"

          docker run --rm "$image_id" /bin/bash -lc '
            set -euo pipefail
            test -f /opt/searchkernel/native-validation-pass
            for cmd in cargo rustc rustfmt cargo-clippy c++ flatc python3 curl rg gh php ruby composer node npm nm readelf; do
              command -v "$cmd" >/dev/null || {
                echo "required CI-image command is unavailable: $cmd" >&2
                exit 1
              }
            done
            rustc --version | grep -q "^rustc 1\.98\.0 "
            test "$(flatc --version)" = "flatc version 25.12.19"
          '

      - name: Create job-private Docker state
        env:
          EXPECTED_HEAD: ${{ steps.revision.outputs.sha }}
          CI_TARGET: ${{ inputs.target }}
        shell: bash
        working-directory: ${{ steps.checkout.outputs.absolute }}
        run: |
          set -euo pipefail

          SAFE_TARGET=$(printf '%s' "$CI_TARGET" | tr -c 'A-Za-z0-9_.-' '-')
          SOURCE_VOLUME="searchkernel-ci-src-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$SAFE_TARGET"
          TARGET_VOLUME="searchkernel-ci-target-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$SAFE_TARGET"
          CONTAINER_NAME="searchkernel-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$SAFE_TARGET"
          ARTIFACT_DIR="$RUNNER_TEMP/searchkernel-ci-artifacts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$SAFE_TARGET"

          docker volume rm -f "$SOURCE_VOLUME" "$TARGET_VOLUME" >/dev/null 2>&1 || true
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"

          docker volume create "$SOURCE_VOLUME" >/dev/null
          docker volume create "$TARGET_VOLUME" >/dev/null

          NATIVE_VOLUME=$(bash tools/ensure-ci-vespa-volume.sh \
            "$CI_IMAGE_ID" \
            "$CI_VESPA_IMAGE_REF" \
            "$CI_VESPA_COMMIT" \
            "$CI_VESPA_BUNDLE_ID")
          echo "Using immutable Vespa volume: $NATIVE_VOLUME"

          read -r SCCACHE_BINARY_VOLUME SCCACHE_SOCKET_VOLUME < <(
            bash tools/ensure-ci-sccache.sh "$CI_IMAGE_ID"
          )
          echo "Using pinned sccache binary volume: $SCCACHE_BINARY_VOLUME"
          echo "Using shared sccache socket volume: $SCCACHE_SOCKET_VOLUME"

          bundle="$RUNNER_TEMP/searchkernel-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$SAFE_TARGET.bundle"
          rm -f "$bundle"
          git bundle create "$bundle" --all HEAD

          cat "$bundle" | docker run --rm -i \
            -e EXPECTED_HEAD="$EXPECTED_HEAD" \
            -v "$SOURCE_VOLUME:/workspace" \
            "$CI_IMAGE_ID" \
            /bin/bash -lc '
              set -euo pipefail
              bundle=/tmp/searchkernel.bundle
              cat > "$bundle"
              git clone --quiet "$bundle" /workspace
              git -C /workspace checkout --quiet --detach "$EXPECTED_HEAD"
              git -C /workspace config core.hooksPath .githooks
              rm -f "$bundle"
            '
          rm -f "$bundle"

          actual=$(docker run --rm \
            -v "$SOURCE_VOLUME:/work" \
            -w /work \
            "$CI_IMAGE_ID" \
            /bin/bash -lc 'git config --global --add safe.directory /work && git rev-parse HEAD')

          if [[ "${actual,,}" != "${EXPECTED_HEAD,,}" ]]; then
            echo "::error::container snapshot expected $EXPECTED_HEAD, found $actual"
            exit 1
          fi

          {
            echo "SOURCE_VOLUME=$SOURCE_VOLUME"
            echo "TARGET_VOLUME=$TARGET_VOLUME"
            echo "NATIVE_VOLUME=$NATIVE_VOLUME"
            echo "SCCACHE_BINARY_VOLUME=$SCCACHE_BINARY_VOLUME"
            echo "SCCACHE_SOCKET_VOLUME=$SCCACHE_SOCKET_VOLUME"
            echo "CONTAINER_NAME=$CONTAINER_NAME"
            echo "ARTIFACT_DIR=$ARTIFACT_DIR"
          } >> "$GITHUB_ENV"

      - name: Execute lane with isolated source and target state
        env:
          EXPECTED_HEAD: ${{ steps.revision.outputs.sha }}
          CI_TARGET: ${{ inputs.target }}
          ABI_BASELINE_SHA: ${{ inputs.baseline_sha }}
          HEAD_REF: ${{ inputs.head_ref }}
          AUTOFIX_TOKEN: ${{ secrets.autofix_token }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        working-directory: ${{ steps.checkout.outputs.absolute }}
        run: |
          set -euo pipefail

          docker run --rm -i             --name "$CONTAINER_NAME"             --pids-limit=-1             -v "$SOURCE_VOLUME:/work"             -v "$TARGET_VOLUME:/cargo-target"             -v "$NATIVE_VOLUME:/opt/searchkernel/native-sdk-cache:ro"             -v "$SCCACHE_BINARY_VOLUME:/opt/searchkernel/sccache:ro"             -v "$SCCACHE_SOCKET_VOLUME:/sccache:ro"             -v "$ARTIFACT_DIR:/artifacts"             -w /work             -e EXPECTED_HEAD="$EXPECTED_HEAD"             -e CI_TARGET="$CI_TARGET"             -e ABI_BASELINE_SHA="$ABI_BASELINE_SHA"             -e HEAD_REF="$HEAD_REF"             -e AUTOFIX_TOKEN="$AUTOFIX_TOKEN"             -e GH_TOKEN="$GH_TOKEN"             -e PR_NUMBER="$PR_NUMBER"             -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY"             -e GITHUB_API_URL="$GITHUB_API_URL"             -e SEARCHKERNEL_BUILD_ENV=ci             -e CARGO_TARGET_DIR=/cargo-target             -e RUSTC_WRAPPER=/opt/searchkernel/sccache/sccache             -e SCCACHE_SERVER_UDS=/sccache/sccache.sock             -e SCCACHE_CLIENT_SIDE=1             -e SCCACHE_IGNORE_SERVER_IO_ERROR=1             -e FLATBUFFERS_CPP_ROOT=/usr/local             -e FLATC_PATH=/usr/local/bin/flatc             -e CC=/opt/rh/gcc-toolset-15/root/usr/bin/gcc             -e CXX=/opt/rh/gcc-toolset-15/root/usr/bin/g++             -e AR=/opt/rh/gcc-toolset-15/root/usr/bin/ar             -e RANLIB=/opt/rh/gcc-toolset-15/root/usr/bin/ranlib             -e LIBRARY_PATH=/opt/rh/gcc-toolset-15/root/usr/lib64:/opt/rh/gcc-toolset-15/root/usr/lib             -e CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=/opt/rh/gcc-toolset-15/root/usr/bin/gcc             "$CI_IMAGE_ID"             /bin/bash -s <<'BASH'
          set -euo pipefail
          finish_lane() {
            echo "SCCACHE STATS"
            /opt/searchkernel/sccache/sccache --show-stats || true
            chmod -R a+rwX /artifacts 2>/dev/null || true
          }
          trap finish_lane EXIT

          HEAD_CHECK_TOKEN="${GH_TOKEN:-}"
          unset GH_TOKEN

          git config --global --add safe.directory /work
          export CI_PYTHON="$PYTHON"
          export PYTHONPATH="/work/clients/python${PYTHONPATH:+:$PYTHONPATH}"

          actual=$(git rev-parse HEAD)
          if [[ "${actual,,}" != "${EXPECTED_HEAD,,}" ]]; then
            echo "expected exact revision $EXPECTED_HEAD in CI image, found $actual" >&2
            exit 1
          fi

          # The host checks this receipt after Docker exits. Without -i, bash -s
          # reads EOF and returns success without executing any lane code.
          printf '%s %s\n' "$EXPECTED_HEAD" "$CI_TARGET" > /artifacts/lane-started

          # No workflow is allowed to repair or mutate a host toolchain. These
          # are immutable image inputs. Source and Cargo target state stay
          # job-private; only sccache compiler outputs are shared through the
          # runner-local content-addressed cache server.
          for compiler in /opt/rh/gcc-toolset-15/root/usr/bin/gcc /opt/rh/gcc-toolset-15/root/usr/bin/g++; do
            [[ -x "$compiler" ]] || {
              echo "required GCC 15 compiler is unavailable: $compiler" >&2
              exit 1
            }
          done
          [[ "$(/opt/rh/gcc-toolset-15/root/usr/bin/gcc -dumpfullversion -dumpversion | cut -d. -f1)" -ge 15 ]]
          [[ "$(/opt/rh/gcc-toolset-15/root/usr/bin/g++ -dumpfullversion -dumpversion | cut -d. -f1)" -ge 15 ]]

          for cmd in cargo rustc rustfmt cargo-clippy c++ flatc python3 curl rg gh php ruby composer node npm ldd sha256sum nm readelf; do
            command -v "$cmd" >/dev/null 2>&1 || {
              echo "required CI-image command is unavailable from $CI_IMAGE: $cmd" >&2
              exit 1
            }
          done
          rustc --version | grep -q '^rustc 1\.98\.0 '
          test "$(flatc --version)" = "flatc version 25.12.19"
          /usr/bin/python3 -c 'import clang.cindex'
          "$PYTHON" -c 'import flatbuffers, grpc, google.protobuf'
          test -f /opt/searchkernel/native-validation-pass

          unset VESPA_ROOT || true
          unset VESPA_LIBRARY_ROOT || true
          unset VESPA_DEPS || true
          unset VESPA_DEPS_LIB_DIR || true
          unset VESPA_DEPS_INCLUDE_DIR || true
          unset VESPA_EXTRA_LIB_DIR || true
          unset VESPA_AWS_LIB_DIR || true
          unset SK_NATIVE_SDK || true
          unset SK_NATIVE_BASE_ARTIFACT_URL || true
          unset SK_NATIVE_BASE_ARTIFACT_GENERATION || true
          unset SEARCHKERNEL_VERIFY_LIVE_ORACLE || true

          native_base=$(./dev native-sdk path)
          case "$native_base" in
            /opt/searchkernel/native-sdk-cache/ci/*/objects/*) ;;
            *)
              echo "CI resolved native base outside the mounted immutable Vespa cache: $native_base" >&2
              exit 1
              ;;
          esac
          echo "Using mounted immutable native base: $native_base"

          assert_current_pr_head() {
            local phase=$1
            if [[ -z "${PR_NUMBER:-}" ]]; then
              return 0
            fi

            local response current state
            response=$(curl --fail --silent --show-error               --connect-timeout 5               --max-time 15               -H "Authorization: Bearer $HEAD_CHECK_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "${GITHUB_API_URL:-https://api.github.com}/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
            read -r current state < <(
              python3 -c 'import json,sys; data=json.load(sys.stdin); print(data.get("head", {}).get("sha", ""), data.get("state", ""))' <<<"$response"
            )
            if [[ -z "$current" || -z "$state" ]]; then
              echo "::error::could not resolve current head/state for PR #$PR_NUMBER before $phase"
              exit 1
            fi

            if [[ "$state" != "open" ]]; then
              echo "::notice title=Superseded verification::PR #$PR_NUMBER is $state; stopping obsolete verification for $EXPECTED_HEAD before $phase."
              exit 0
            fi

            if [[ "${current,,}" != "${EXPECTED_HEAD,,}" ]]; then
              echo "::notice title=Superseded verification::PR #$PR_NUMBER now points to $current; stopping obsolete verification for $EXPECTED_HEAD before $phase."
              exit 0
            fi

            echo "PR #$PR_NUMBER still points to $EXPECTED_HEAD before $phase."
          }

          assert_current_pr_head preflight

          # Keep real-Vespa verifier output signal-dense. This intentionally
          # suppresses routine info/event/config chatter while preserving
          # warning, error, and fatal diagnostics.
          export VESPA_LOG_LEVEL="${VESPA_LOG_LEVEL:-all -info -event -config -debug -spam}"

          run_phase() {
            local phase=$1
            shift
            assert_current_pr_head "$phase"
            env -u GH_TOKEN "$@"
          }

          build_native_searchkerneld() {
            local phase=$1
            local cargo_messages
            cargo_messages=$(mktemp)

            if ! run_phase "$phase" bash -c '
              set -euo pipefail
              cargo build -p searchkerneld --features native                 --message-format=json-render-diagnostics | tee "$1"
            ' _ "$cargo_messages"; then
              rm -f "$cargo_messages"
              return 1
            fi

            if ! NATIVE_ADAPTER_LIB=$(python3 .github/ci/resolve-native-adapter-lib.py               "$cargo_messages" "$CARGO_TARGET_DIR"); then
              rm -f "$cargo_messages"
              return 1
            fi
            rm -f "$cargo_messages"
            export NATIVE_ADAPTER_LIB
          }

          prepare_native_full_probe_sdk() {
            local native_probe_sdk="$CARGO_TARGET_DIR/native-verifier-sdk"
            local native_probe_build="$CARGO_TARGET_DIR/native-verifier-sdk-build"
            local native_probe_vespa_root

            native_probe_vespa_root=$(bash tools/resolve-native-sdk.sh vespa-root)

            run_phase native-full-prepare-native-probe-sdk env \
              -u HEAD_CHECK_TOKEN \
              -u AUTOFIX_TOKEN \
              SEARCHKERNEL_NATIVE_PROBE_SDK="$native_probe_sdk" \
              SEARCHKERNEL_NATIVE_PROBE_SDK_BUILD="$native_probe_build" \
              SEARCHKERNEL_NATIVE_PROBE_BASE_SDK="$native_base" \
              SEARCHKERNEL_NATIVE_PROBE_VESPA_ROOT="$native_probe_vespa_root" \
              bash -c '
                set -euo pipefail
                source reference/vespa/common/verify-common.sh
                prepare_native_probe_sdk
              '

            [[ -f "$native_probe_sdk/manifest.json" ]]
            [[ -f "$native_probe_sdk/include/searchkernel_vespa.h" ]]

            export SEARCHKERNEL_NATIVE_PROBE_SDK="$native_probe_sdk"
            export SEARCHKERNEL_NATIVE_PROBE_SDK_BUILD="$native_probe_build"
            export SEARCHKERNEL_NATIVE_PROBE_BASE_SDK="$native_base"
            export SEARCHKERNEL_NATIVE_PROBE_VESPA_ROOT="$native_probe_vespa_root"
            export SEARCHKERNEL_NATIVE_PROBE_SDK_PREPARED=1
          }

          case "$CI_TARGET" in
            rust-non-native)
              run_phase protocol-bfbs bash tools/check-flatbuffers-bfbs.sh
              run_phase protocol-rust-generated bash tools/check-searchkernel-protocol-generated.sh
              run_phase rust-test cargo test --workspace --all-targets --no-default-features
              run_phase search-endpoint-hostile-inputs cargo test -p searchkerneld --no-default-features --features test-support --test search_endpoints
              run_phase instantsearch-request-compat cargo test -p searchkerneld --no-default-features --features test-support --test instantsearch_compat
              run_phase api-conformance reference/api-conformance/verify.sh
              ;;

            python)
              run_phase python-install "$PYTHON" -m pip install -e clients/python
              run_phase python-tests "$PYTHON" -m unittest discover -s clients/python/tests -p 'test_*.py'
              ;;

            typescript)
              run_phase typescript-install npm ci --prefix clients/typescript
              run_phase typescript-generation-regressions ./tools/test-typescript-generation.sh
              run_phase typescript-generate npm run generate --prefix clients/typescript
              run_phase typescript-check-generated npm run check:generated --prefix clients/typescript
              run_phase typescript-typecheck npm --prefix clients/typescript run typecheck
              run_phase typescript-tests npm --prefix clients/typescript test
              run_phase typescript-package npm run test:package --prefix clients/typescript
              ;;

            ruby)
              if [[ ! -d clients/ruby ]]; then
                echo "Ruby client is only pre-registered on this revision; no Ruby product surface exists yet."
                exit 0
              fi
              run_phase ruby-tests ./dev test ruby
              ;;

            tooling)
              run_phase tooling-python-syntax "$PYTHON" -m compileall -q tools .github/ci
              run_phase ci-runner-isolation "$PYTHON" .github/ci/test_ci_image_runner_isolation.py
              run_phase verification-cache-policy "$PYTHON" .github/ci/test_verification_cache_policy.py
              run_phase dev-syntax bash -n dev
              run_phase dev-help bash dev help
              run_phase dev-ci-image-contract bash tools/test-dev-ci-image.sh
              run_phase ci-image-publishing-contract bash tools/test-ci-image-publishing.sh
              run_phase ci-image-identity "$PYTHON" tools/test_ci_image_identity.py
              run_phase native-sdk-packaging bash tools/test-native-sdk-packaging.sh
              run_phase native-consumer-contract "$PYTHON" tools/check-native-consumer-contract.py
              run_phase native-environment-fingerprint bash tools/test-native-environment-fingerprint.sh
              run_phase native-sdk-cache bash tools/test-native-sdk-cache.sh
              run_phase clippy-runner "$PYTHON" tools/test_run_clippy.py
              run_phase python-dependency-contract "$PYTHON" tools/test_python_dependency_contract.py
              run_phase toolchain-authorities "$PYTHON" tools/test_toolchain_authorities.py
              run_phase verifier-routing bash reference/vespa/verifiers/test-routing.sh
              run_phase verifier-build-ownership-tests "$PYTHON" tools/test_check_verifier_build_ownership.py
              run_phase verifier-build-ownership "$PYTHON" tools/check-verifier-build-ownership.py
              ;;

            client-capabilities)
              run_phase capabilities-check "$PYTHON" tools/check-capabilities.py --check
              run_phase client-contracts-check "$PYTHON" tools/check-client-contracts.py --check
              run_phase capabilities-tests "$PYTHON" tools/test_check_capabilities.py
              run_phase client-contract-tests "$PYTHON" tools/test_check_client_contracts.py
              run_phase python-dependency-contract "$PYTHON" tools/test_python_dependency_contract.py
              run_phase php-client ./dev test php
              ;;

            abi-surface)
              ABI_PYTHON=/usr/bin/python3
              run_phase abi-authority-tests "$ABI_PYTHON" tools/test_check_native_abi_authorities.py
              run_phase abi-authorities "$ABI_PYTHON" tools/check-native-abi-authorities.py
              run_phase abi-surface-tests "$ABI_PYTHON" tools/test_check_abi_surface.py
              run_phase native-bindings-regression bash tools/test-check-native-bindings.sh
              run_phase checked-in-bindings bash tools/check-native-bindings.sh
              run_phase layout bash tools/check-layout.sh
              run_phase native-sdk-cache bash tools/test-native-sdk-cache.sh

              args=(
                core/native/vespa/searchkernel_vespa.h
                --linker-map core/native/vespa/searchkernel_vespa.map
              )
              if [[ -n "${ABI_BASELINE_SHA:-}" &&
                    "$ABI_BASELINE_SHA" != "0000000000000000000000000000000000000000" ]]; then
                baseline_header=$(mktemp)
                git show "${ABI_BASELINE_SHA}:core/native/vespa/searchkernel_vespa.h" > "$baseline_header"
                args+=(--baseline-header "$baseline_header")
              fi
              run_phase abi-contract "$ABI_PYTHON" tools/check_abi_surface.py "${args[@]}"
              ;;

            nightly-universe)
              run_phase nightly-universe ./dev universe
              ;;

            nightly-coverage)
              run_phase nightly-coverage env SEARCHKERNEL_COVERAGE_DIR=/artifacts/coverage ./dev coverage
              run_phase nightly-coverage-evidence python3 - "$EXPECTED_HEAD" <<'PY'
          import json
          import pathlib
          import sys
          
          root = pathlib.Path("/artifacts/coverage")
          expected_head = sys.argv[1]
          required_files = (
              "coverage.json",
              "summary.json",
              "lcov.info",
              "summary.txt",
              "README.txt",
              "metadata.json",
              "html/index.html",
          )
          missing = [
              relative
              for relative in required_files
              if not (root / relative).is_file() or (root / relative).stat().st_size == 0
          ]
          if missing:
              raise SystemExit(f"coverage evidence missing or empty: {', '.join(missing)}")
          
          with (root / "metadata.json").open(encoding="utf-8") as stream:
              metadata = json.load(stream)
          
          if metadata.get("git_head", "").lower() != expected_head.lower():
              raise SystemExit(
                  f"coverage metadata head mismatch: expected {expected_head}, "
                  f"found {metadata.get('git_head')!r}"
              )
          if metadata.get("working_tree_clean") is not True:
              raise SystemExit(
                  f"coverage metadata reports dirty exact-head snapshot: "
                  f"{metadata.get('working_tree_status')!r}"
              )
          if metadata.get("tool") != "cargo-llvm-cov 0.9.1":
              raise SystemExit(
                  f"unexpected coverage tool version: {metadata.get('tool')!r}"
              )
          if metadata.get("native_cpp_coverage") is not False:
              raise SystemExit("coverage metadata must explicitly exclude native C++ coverage")
          
          for relative in ("coverage.json", "summary.json"):
              with (root / relative).open(encoding="utf-8") as stream:
                  json.load(stream)
          
          print(f"Coverage evidence PASS for exact head {expected_head}.")
          PY
              ;;
            nightly-rust)
              run_phase nightly-format cargo fmt --all --check
              run_phase nightly-check cargo check --workspace --all-targets --no-default-features
              run_phase nightly-clippy-regression python3 tools/test_run_clippy.py
              run_phase nightly-clippy ./dev lint                 --profile rust-clippy-non-native                 --diagnostics-dir /artifacts/clippy
              SEARCHKERNEL_MODEL_STEPS=250               SEARCHKERNEL_MODEL_SEEDS=0x517a11,0x9e3779,0xd1ce42,0x4f1ab7,0xa50933,0xe2710d,0x6c8824,0xb342f0                 run_phase nightly-tests cargo test --workspace --all-targets --no-default-features
              ;;

            nightly-contracts)
              run_phase nightly-python-install "$PYTHON" -m pip install -e 'clients/python[codegen]'
              run_phase nightly-layout bash tools/check-layout.sh
              run_phase nightly-ir-boundary bash tools/check-ir-boundary.sh
              run_phase nightly-semantic-entry "$PYTHON" tools/check-search-semantic-entry-points.py
              # python3-clang belongs to the distro Python in the canonical AlmaLinux image.
              # Keep the client/codegen lane on $PYTHON, but run the ABI parser with the
              # interpreter that owns its libclang bindings, as the dedicated ABI lane does.
              ABI_PYTHON=/usr/bin/python3
              run_phase nightly-abi-surface "$ABI_PYTHON" tools/check_abi_surface.py core/native/vespa/searchkernel_vespa.h
              run_phase nightly-python-boundary "$PYTHON" tools/check-python-flatbuffers-boundary.py
              run_phase nightly-bfbs bash tools/check-flatbuffers-bfbs.sh
              run_phase nightly-rpc bash tools/check-searchkernel-rpc.sh
              run_phase nightly-python-grpc bash tools/check-python-grpc.sh
              run_phase nightly-capabilities "$PYTHON" tools/check-capabilities.py --check
              run_phase nightly-client-contracts "$PYTHON" tools/check-client-contracts.py --check
              run_phase nightly-capability-tests "$PYTHON" tools/test_check_capabilities.py
              run_phase nightly-client-contract-tests "$PYTHON" tools/test_check_client_contracts.py
              run_phase nightly-python-tests "$PYTHON" -m unittest discover -s clients/python/tests -p 'test_*.py'
              ;;

            nightly-client-e2e)
              run_phase nightly-client-python-install "$PYTHON" -m pip install -e clients/python
              run_phase nightly-client-node-install npm ci --prefix clients/typescript
              run_phase nightly-client-e2e "$PYTHON" tools/check-client-contracts.py --run-e2e
              ;;

            nightly-abi)
              run_phase nightly-abi-tests /usr/bin/python3 tools/test_check_abi_surface.py
              run_phase nightly-native-sdk-cache bash tools/test-native-sdk-cache.sh
              ;;

            persistence)
              run_phase persistence-executable ./dev verify persistence
              ;;

            native-full)
              run_phase native-full-release-support "$PYTHON" tools/check-release-support.py
              # ABI-sensitive changes are covered by the dedicated exact-head
              # ABI surface workflow, which compares against the real PR/base SHA.
              # Prepare once in a tokenless child, then publish only the fixed
              # verifier paths/marker into the parent for later verifier reuse.
              prepare_native_full_probe_sdk

              run_phase native-full-hnsw ./dev verify vespa.nearest-neighbor.hnsw
              run_phase native-full-product-integration ./dev verify product.integration --baseline-already-proved
              run_phase native-full-grouping-yql ./dev verify vespa.grouping.yql
              run_phase native-full-recovery ./dev verify vespa.recovery
              run_phase native-full-phase9 reference/vespa/phase9/verify-phase9.sh --baseline-already-proved
              run_phase native-full-python-e2e tools/run-python-native-e2e.sh --prevalidated-native-sdk
              run_phase native-full-persistence ./dev verify persistence
              run_phase native-full-consumer-package bash tools/test-native-consumer-package.sh
              ;;

            client-e2e)
              run_phase client-e2e-release-support "$PYTHON" tools/check-release-support.py
              run_phase client-e2e-qualification-policy "$PYTHON" tools/test_qualify_consumer_release.py
              run_phase client-e2e-quickstart-docs "$PYTHON" tools/render-release-quickstarts.py --check
              "$PYTHON" tools/check-python-dependencies.py
              run_phase client-release-build "$PYTHON" tools/package-consumer-release.py --output /artifacts/consumer-release
              run_phase client-release-verify "$PYTHON" tools/check-consumer-release.py /artifacts/consumer-release
              mkdir -p /artifacts/consumer-release-tools/native-base
              bash tools/stage-native-base-qualification-artifact.sh /artifacts/consumer-release-tools/native-base
              cp tools/qualify-consumer-release.py /artifacts/consumer-release-tools/
              cp -R examples/release-quickstart /artifacts/consumer-release-tools/quickstarts
              build_native_searchkerneld client-e2e-build
              run_phase client-e2e-run env                 SEARCHKERNEL_LOCAL_HOST="$CARGO_TARGET_DIR/debug/searchkerneld"                 SEARCHKERNEL_SDK_LIB="$NATIVE_ADAPTER_LIB"                 "$PYTHON" tools/check-client-contracts.py --run-e2e
              run_phase client-real-e2e-parity ./dev test client-real-e2e-parity
              ;;

            closure-422)
              export CARGO_TARGET_DIR=/cargo-target/closure-422
              if [[ -e upstream/vespa/.git ||
                    -f upstream/vespa/searchcore/src/tests/proton/documentdb/CMakeFiles/searchcore_embedded_crud_spike_app.dir/link.txt ||
                    -f upstream/vespa/searchcore/src/tests/proton/documentdb/CMakeFiles/searchcore_embedded_crud_spike_app.dir/flags.make ]]; then
                echo "closure-422 requires a checkout with no configured source Vespa tree" >&2
                exit 1
              fi

              packaged_vespa=$(bash tools/resolve-native-sdk.sh vespa-root)
              case "$packaged_vespa" in
                /opt/searchkernel/native-sdk-cache/ci/*/toolchains/*/upstream/vespa) ;;
                *)
                  echo "closure-422 resolved Vespa outside the image toolchain: $packaged_vespa" >&2
                  exit 1
                  ;;
              esac
              [[ -f "$packaged_vespa/.searchkernel-vespa-artifact.json" ]] || {
                echo "closure-422 image provenance marker is missing: $packaged_vespa" >&2
                exit 1
              }

              build_native_searchkerneld closure-422-build
              daemon="$CARGO_TARGET_DIR/debug/searchkerneld"
              [[ -x "$daemon" ]] || {
                echo "closure-422 did not produce native searchkerneld: $daemon" >&2
                exit 1
              }

              run_phase closure-422-m14 ./dev verify m14
              run_phase closure-422-rust-real-engine ./dev verify product.rust-real-engine
              run_phase closure-422-integration ./dev verify integration
              "$PYTHON" tools/check-python-dependencies.py
              run_phase closure-422-php-e2e env                 SEARCHKERNEL_LOCAL_HOST="$daemon"                 SEARCHKERNEL_SDK_LIB="$NATIVE_ADAPTER_LIB"                 bash clients/php/examples/run_searchkernel_client_api_e2e.sh
              ;;

            rustfmt-autofix)
              run_phase rustfmt cargo fmt --all
              if git diff --quiet; then
                echo "cargo fmt produced no changes"
                exit 0
              fi

              unexpected=$(
                git diff --name-only |
                  grep -Ev '\.rs$' || true
              )
              if [[ -n "$unexpected" ]]; then
                echo "::error::cargo fmt unexpectedly changed non-Rust files:" >&2
                printf '%s\n' "$unexpected" >&2
                exit 1
              fi
              git diff --check

              [[ -n "${AUTOFIX_TOKEN:-}" ]] || {
                echo "::error::RUSTFMT_AUTOFIX_TOKEN is not configured." >&2
                exit 1
              }
              [[ -n "${HEAD_REF:-}" ]] || {
                echo "::error::rustfmt autofix requires the pull-request head branch" >&2
                exit 1
              }

              assert_current_pr_head rustfmt-push
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -u
              git diff --cached --check
              git -c core.hooksPath=/dev/null -c commit.gpgsign=false                 commit -m "style: apply cargo fmt"
              git push                 "https://x-access-token:${AUTOFIX_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"                 "HEAD:refs/heads/${HEAD_REF}"
              ;;

            *)
              run_phase requested-target ./dev verify "$CI_TARGET"
              ;;
          esac
          BASH

          receipt=$(cat "$ARTIFACT_DIR/lane-started" 2>/dev/null || true)
          if [[ "$receipt" != "$EXPECTED_HEAD $CI_TARGET" ]]; then
            echo "::error::CI container exited without executing the exact-head lane preflight"
            exit 1
          fi

          if [[ "$CI_TARGET" == "client-e2e" ]]; then
            echo "==> Qualify packaged release in clean consumer"
            docker run --rm \
              -v "$ARTIFACT_DIR/consumer-release:/release:ro" \
              -v "$ARTIFACT_DIR/consumer-release-tools:/qualification:ro" \
              "$CI_IMAGE_ID" \
              /bin/bash -lc 'python3 /qualification/qualify-consumer-release.py /release'
          fi

      - name: Upload nightly coverage
        if: ${{ always() && inputs.target == 'nightly-coverage' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}-${{ github.job }}
          path: ${{ env.ARTIFACT_DIR }}/coverage
          # Superseded exact-head jobs can exit cleanly before producing coverage.
          # Current-head coverage validates every required file inside the lane.
          if-no-files-found: warn
          retention-days: 30
      - name: Upload nightly Clippy repair packet
        if: ${{ always() && inputs.target == 'nightly-rust' }}
        uses: actions/upload-artifact@v4
        with:
          name: clippy-repair-${{ github.run_id }}-${{ github.job }}
          path: ${{ env.ARTIFACT_DIR }}/clippy
          if-no-files-found: ignore

      - name: Remove job-private Docker state
        if: always()
        shell: bash
        run: |
          set +e
          docker rm -f "${CONTAINER_NAME:-}" >/dev/null 2>&1 || true
          if [[ -n "${SOURCE_VOLUME:-}" || -n "${TARGET_VOLUME:-}" ]]; then
            docker volume rm -f "${SOURCE_VOLUME:-}" "${TARGET_VOLUME:-}" >/dev/null 2>&1 || true
          fi
          rm -rf "${ARTIFACT_DIR:-}"

      - name: Remove job-private checkout
        if: always() && steps.checkout.outputs.absolute != ''
        env:
          CHECKOUT_DIR: ${{ steps.checkout.outputs.absolute }}
        shell: bash
        run: |
          set -euo pipefail
          case "$CHECKOUT_DIR" in
            "$GITHUB_WORKSPACE"/.ci-checkouts/*) ;;
            *)
              echo "::error::refusing to clean unexpected checkout path: $CHECKOUT_DIR"
              exit 1
              ;;
          esac
          rm -rf -- "$CHECKOUT_DIR"
