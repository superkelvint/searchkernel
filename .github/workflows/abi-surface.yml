name: ABI surface

on:
  push:
    branches: [main]
    paths:
      - "core/native/**"
      - "core/crates/searchkernel-vespa-bindings/**"
      - "reference/vespa/NATIVE_ABI_CONTRACT.h"
      - "reference/vespa/PINNED_VESPA.json"
      - "reference/vespa/common/verify-common.sh"
      - "tools/check-native-abi-authorities.py"
      - "tools/test_check_native_abi_authorities.py"
      - "tools/check_abi_surface.py"
      - "tools/test_check_abi_surface.py"
      - "tools/check-native-bindings.sh"
      - "tools/test-check-native-bindings.sh"
      - "tools/check-native-bindings/**"
      - "tools/check-layout.sh"
      - "tools/native-build-fingerprint.py"
      - "tools/*native-sdk*.sh"
      - "dev"
      - ".github/workflows/abi-surface.yml"
      - ".github/workflows/ci-image-runner.yml"
  pull_request:
    paths:
      - "core/native/**"
      - "core/crates/searchkernel-vespa-bindings/**"
      - "reference/vespa/NATIVE_ABI_CONTRACT.h"
      - "reference/vespa/PINNED_VESPA.json"
      - "reference/vespa/common/verify-common.sh"
      - "tools/check-native-abi-authorities.py"
      - "tools/test_check_native_abi_authorities.py"
      - "tools/check_abi_surface.py"
      - "tools/test_check_abi_surface.py"
      - "tools/check-native-bindings.sh"
      - "tools/test-check-native-bindings.sh"
      - "tools/check-native-bindings/**"
      - "tools/check-layout.sh"
      - "tools/native-build-fingerprint.py"
      - "tools/*native-sdk*.sh"
      - "dev"
      - ".github/workflows/abi-surface.yml"
      - ".github/workflows/ci-image-runner.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  abi-surface:
    name: Public ABI contract check
    uses: ./.github/workflows/ci-image-runner.yml
    with:
      revision: ${{ github.event.pull_request.head.sha || github.sha }}
      target: abi-surface
      baseline_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    secrets: inherit
