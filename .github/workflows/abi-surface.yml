name: ABI surface

on:
  push:
    branches: [main]
    paths:
      - "core/native/**"
      - "core/crates/searchkernel-vespa-bindings/**"
      - "tools/check_abi_surface.py"
      - "tools/test_check_abi_surface.py"
      - "tools/check-layout.sh"
      - "tools/native-build-fingerprint.py"
      - "tools/*native-sdk*.sh"
      - "dev"
  pull_request:
    paths:
      - "core/native/**"
      - "core/crates/searchkernel-vespa-bindings/**"
      - "tools/check_abi_surface.py"
      - "tools/test_check_abi_surface.py"
      - "tools/check-layout.sh"
      - "tools/native-build-fingerprint.py"
      - "tools/*native-sdk*.sh"
      - "dev"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  abi-surface:
    name: Public ABI aggregate check
    runs-on: [self-hosted, linux, x64]
    env:
      CARGO_TARGET_DIR: target/ci
      SEARCHKERNEL_BUILD_ENV: ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install libclang Python bindings
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libclang-dev python3-clang

      - name: Run ABI surface regression tests
        run: python3 tools/test_check_abi_surface.py

      - name: Check repository layout
        run: bash tools/check-layout.sh

      - name: Verify cross-worktree native SDK cache
        run: bash tools/test-native-sdk-cache.sh

      - name: Check public Vespa ABI header
        run: python3 tools/check_abi_surface.py core/native/vespa/searchkernel_vespa.h
