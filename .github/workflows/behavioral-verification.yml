name: Behavioral verification

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: behavioral-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify exact-head behavior
    runs-on: [self-hosted, linux, x64]
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      python: ${{ steps.changes.outputs.python }}
      typescript: ${{ steps.changes.outputs.typescript }}
      ruby: ${{ steps.changes.outputs.ruby }}
      native: ${{ steps.changes.outputs.native }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Select runner Python
        run: bash .github/ci/select-python.sh

      - name: Enforce runner-Python workflow policy
        run: bash .github/ci/check-python-workflows.sh

      - name: Reject stale verification checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ "${actual,,}" != "${EXPECTED_HEAD,,}" ]]; then
            echo "::error title=Stale verification checkout::Expected exact PR head $EXPECTED_HEAD, checked out $actual. Verification from a different SHA cannot authorize this head."
            exit 1
          fi
          echo "Verified exact PR head $actual."

      - name: Resolve exact-head CI helpers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          trusted_dir="$RUNNER_TEMP/searchkernel-trusted-exact-head-ci"
          rm -rf "$trusted_dir"
          mkdir -p "$trusted_dir"
          git show "$BASE_SHA:.github/ci/exact_head.py" > "$trusted_dir/exact_head.py"
          echo "TRUSTED_EXACT_HEAD_HELPER=$trusted_dir/exact_head.py" >> "$GITHUB_ENV"

          # The verification DAG becomes part of the trusted base policy bundle
          # once the base revision contains it. This conditional is only needed
          # to bootstrap the first DAG-consuming selector revision.
          if git cat-file -e "$BASE_SHA:verification/dag.py" 2>/dev/null; then
            git show "$BASE_SHA:verification/dag.py" > "$trusted_dir/dag.py"
            git show "$BASE_SHA:verification/dag.toml" > "$trusted_dir/dag.toml"
            echo "SEARCHKERNEL_VERIFICATION_DAG_MODULE=$trusted_dir/dag.py" >> "$GITHUB_ENV"
            echo "SEARCHKERNEL_VERIFICATION_DAG=$trusted_dir/dag.toml" >> "$GITHUB_ENV"
          fi

          if [[ -f .github/ci/exact_head.py && -f .github/ci/test_exact_head.py ]]; then
            regression_dir="$PWD/.github/ci"
          else
            regression_dir="$RUNNER_TEMP/searchkernel-exact-head-ci"
            rm -rf "$regression_dir"
            mkdir -p "$regression_dir"
            for name in exact_head.py test_exact_head.py; do
              if [[ -f ".github/ci/$name" ]]; then
                cp ".github/ci/$name" "$regression_dir/$name"
              else
                git show "$BASE_SHA:.github/ci/$name" > "$regression_dir/$name"
              fi
            done
          fi
          echo "EXACT_HEAD_TEST=$regression_dir/test_exact_head.py" >> "$GITHUB_ENV"

      - name: Verify exact-head CI regressions
        env:
          SEARCHKERNEL_VERIFICATION_DAG_MODULE: ${{ github.workspace }}/verification/dag.py
          SEARCHKERNEL_VERIFICATION_DAG: ${{ github.workspace }}/verification/dag.toml
        run: $CI_PYTHON "$EXACT_HEAD_TEST"

      - name: Verify candidate verification DAG integrity and coverage
        run: |
          $CI_PYTHON verification/dag.py check --repo "$PWD"
          $CI_PYTHON verification/test_dag.py

      - name: Classify changed behavior
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --no-renames -z "$BASE_SHA" "$HEAD_SHA" -- \
            | "$CI_PYTHON" "$TRUSTED_EXACT_HEAD_HELPER" classify --github-output "$GITHUB_OUTPUT"

  rust:
    name: Rust behavior
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64]
    env:
      CARGO_TARGET_DIR: target/ci-exact-head-rust
      SEARCHKERNEL_BUILD_ENV: ci
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Select runner Python
        run: bash .github/ci/select-python.sh

      - name: Reject stale verification checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ "${actual,,}" != "${EXPECTED_HEAD,,}" ]]; then
            echo "::error title=Stale verification checkout::Expected exact PR head $EXPECTED_HEAD, checked out $actual. Verification from a different SHA cannot authorize this head."
            exit 1
          fi
          echo "Verified exact PR head $actual."

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/ci-exact-head-rust"
          shared-key: exact-head-rust

      - name: Cache pinned FlatBuffers toolchain
        uses: actions/cache@v4
        with:
          path: .git/searchkernel/toolchains/flatbuffers/25.12.19
          key: flatbuffers-25.12.19-${{ runner.os }}-${{ runner.arch }}

      - name: Ensure pinned FlatBuffers toolchain
        run: ./dev install flatbuffers

      - name: Run Rust behavioral tests
        run: cargo test --workspace --all-targets --no-default-features

  python:
    name: Python behavior
    needs: classify
    if: needs.classify.outputs.python == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Select runner Python
        run: bash .github/ci/select-python.sh

      - name: Reject stale verification checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ "${actual,,}" != "${EXPECTED_HEAD,,}" ]]; then
            echo "::error title=Stale verification checkout::Expected exact PR head $EXPECTED_HEAD, checked out $actual. Verification from a different SHA cannot authorize this head."
            exit 1
          fi
          echo "Verified exact PR head $actual."

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pinned FlatBuffers toolchain
        uses: actions/cache@v4
        with:
          path: .git/searchkernel/toolchains/flatbuffers/25.12.19
          key: flatbuffers-25.12.19-${{ runner.os }}-${{ runner.arch }}

      - name: Ensure pinned FlatBuffers toolchain
        run: ./dev install flatbuffers

      - name: Install Python client
        run: $CI_PYTHON -m pip install -e clients/python

      - name: Run Python behavioral tests
        run: $CI_PYTHON -m unittest discover -s clients/python/tests -p 'test_*.py'

  typescript:
    name: TypeScript behavior
    needs: classify
    if: needs.classify.outputs.typescript == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Select runner Python
        run: bash .github/ci/select-python.sh

      - name: Reject stale verification checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ "${actual,,}" != "${EXPECTED_HEAD,,}" ]]; then
            echo "::error title=Stale verification checkout::Expected exact PR head $EXPECTED_HEAD, checked out $actual. Verification from a different SHA cannot authorize this head."
            exit 1
          fi
          echo "Verified exact PR head $actual."

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Cache pinned FlatBuffers toolchain
        uses: actions/cache@v4
        with:
          path: .git/searchkernel/toolchains/flatbuffers/25.12.19
          key: flatbuffers-25.12.19-${{ runner.os }}-${{ runner.arch }}

      - name: Ensure pinned FlatBuffers toolchain
        run: ./dev install flatbuffers

      - name: Install TypeScript client
        run: npm ci --prefix clients/typescript

      - name: Run TypeScript generation regressions
        run: ./tools/test-typescript-generation.sh

      - name: Generate TypeScript protocol bindings
        run: npm run generate --prefix clients/typescript

      - name: Verify TypeScript generated bindings
        run: npm run check:generated --prefix clients/typescript

      - name: Typecheck TypeScript client
        run: npm --prefix clients/typescript run typecheck

      - name: Run TypeScript behavioral tests
        run: npm --prefix clients/typescript test

      - name: Verify TypeScript package
        run: npm run test:package --prefix clients/typescript

  ruby:
    name: Ruby behavior
    needs: classify
    if: needs.classify.outputs.ruby == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Reject stale verification checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ "${actual,,}" != "${EXPECTED_HEAD,,}" ]]; then
            echo "::error title=Stale verification checkout::Expected exact PR head $EXPECTED_HEAD, checked out $actual. Verification from a different SHA cannot authorize this head."
            exit 1
          fi
          echo "Verified exact PR head $actual."

      - name: Verify Ruby runtime
        run: ruby --version

      - name: Run Ruby behavioral tests
        run: |
          set -euo pipefail
          if [[ ! -d clients/ruby ]]; then
            echo "Ruby client is only pre-registered on this base; no Ruby product surface exists yet."
            exit 0
          fi
          ./dev test ruby

  exact-head-gate:
    name: Exact-head gate
    needs: [classify, rust, python, typescript, ruby]
    if: always()
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Require every selected behavioral lane
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          RUST_REQUIRED: ${{ needs.classify.outputs.rust }}
          RUST_RESULT: ${{ needs.rust.result }}
          PYTHON_REQUIRED: ${{ needs.classify.outputs.python }}
          PYTHON_RESULT: ${{ needs.python.result }}
          TYPESCRIPT_REQUIRED: ${{ needs.classify.outputs.typescript }}
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
          RUBY_REQUIRED: ${{ needs.classify.outputs.ruby }}
          RUBY_RESULT: ${{ needs.ruby.result }}
          NATIVE_SENSITIVE: ${{ needs.classify.outputs.native }}
        run: |
          set -euo pipefail

          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            echo "::error::Exact-head classification failed for $EXPECTED_HEAD."
            exit 1
          fi

          require_lane() {
            local lane=$1
            local required=$2
            local result=$3
            if [[ "$required" == "true" && "$result" != "success" ]]; then
              echo "::error::$lane behavioral verification for $EXPECTED_HEAD ended as '$result'."
              exit 1
            fi
          }

          require_lane Rust "$RUST_REQUIRED" "$RUST_RESULT"
          require_lane Python "$PYTHON_REQUIRED" "$PYTHON_RESULT"
          require_lane TypeScript "$TYPESCRIPT_REQUIRED" "$TYPESCRIPT_RESULT"
          require_lane Ruby "$RUBY_REQUIRED" "$RUBY_RESULT"

          if [[ "$NATIVE_SENSITIVE" == "true" ]]; then
            echo "::notice title=Native verification is local::Native-sensitive paths changed. CI intentionally does not bootstrap Vespa or run the real-engine gate; local native verification evidence is required by AGENTS.md."
          fi

          echo "All non-native CI behavior required for exact PR head $EXPECTED_HEAD is verified."
