name: CI invariant verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-invariants-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Plan invariant lanes
    runs-on: [self-hosted, linux, x64]
    outputs:
      rust: ${{ steps.behavioral.outputs.rust }}
      python: ${{ steps.behavioral.outputs.python }}
      typescript: ${{ steps.behavioral.outputs.typescript }}
      ruby: ${{ steps.behavioral.outputs.ruby }}
      tooling: ${{ steps.fixed.outputs.tooling }}
      native: ${{ steps.native.outputs.required }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Select runner Python
        run: bash .github/ci/select-python.sh

      - name: Enforce runner-Python workflow policy
        run: bash .github/ci/check-python-workflows.sh

      - name: Enforce immutable self-hosted Rust policy
        run: $CI_PYTHON .github/ci/check-self-hosted-rust-workflows.py

      - name: Test superseded native-head workflow policy
        run: |
          $CI_PYTHON .github/ci/test_native_verifier_runner.py \
            NativeVerifierRunnerWorkflowTests.test_head_guard_stops_closed_pr_even_when_sha_is_unchanged \
            NativeVerifierRunnerWorkflowTests.test_head_guard_runtime_current_stale_and_api_failure \
            NativeVerifierRunnerWorkflowTests.test_superseded_pr_heads_stop_before_each_expensive_native_phase \
            NativeVerifierRunnerWorkflowTests.test_pr_callers_grant_live_head_lookup_permission

      - name: Reject stale verification checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ "${actual,,}" != "${EXPECTED_HEAD,,}" ]]; then
            echo "::error title=Stale verification checkout::Expected exact head $EXPECTED_HEAD, checked out $actual. Verification from a different SHA cannot authorize this revision."
            exit 1
          fi
          echo "Verified exact head $actual."

      - name: Enforce canonical CI evidence ownership
        run: $CI_PYTHON .github/ci/check-ci-evidence-ownership.py

      - name: Test candidate behavioral lane selector
        run: |
          "$CI_PYTHON" .github/ci/test_behavioral_lanes_required.py

      - name: Keep tooling invariant fixed while DAG authorization is offline
        id: fixed
        run: echo "tooling=true" >> "$GITHUB_OUTPUT"

      - name: Resolve changed paths against current target
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          changes_file="$RUNNER_TEMP/searchkernel-changed-paths.txt"
          : > "$changes_file"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "${PR_NUMBER:-}" || -z "${BASE_REF:-}" || -z "${HEAD_SHA:-}" ]]; then
              echo "resolved=false" >> "$GITHUB_OUTPUT"
              echo "Unable to resolve PR target/head metadata; selectors will fail closed."
              exit 0
            fi

            git fetch --no-tags --depth=256 --filter=blob:none origin \
              "+refs/pull/$PR_NUMBER/head:refs/searchkernel/ci-head" \
              "+refs/heads/$BASE_REF:refs/searchkernel/ci-base"

            fetched_head=$(git rev-parse refs/searchkernel/ci-head)
            policy_sha=$(git rev-parse refs/searchkernel/ci-base)
            if [[ "${fetched_head,,}" != "${HEAD_SHA,,}" ]]; then
              echo "resolved=false" >> "$GITHUB_OUTPUT"
              echo "PR head moved while planning ($HEAD_SHA -> $fetched_head); selectors will fail closed."
              exit 0
            fi

            diff_base_sha=$(git merge-base refs/searchkernel/ci-head refs/searchkernel/ci-base || true)
            if [[ -z "$diff_base_sha" ]]; then
              git fetch --no-tags --deepen=1024 --filter=blob:none origin \
                "+refs/pull/$PR_NUMBER/head:refs/searchkernel/ci-head" \
                "+refs/heads/$BASE_REF:refs/searchkernel/ci-base"
              diff_base_sha=$(git merge-base refs/searchkernel/ci-head refs/searchkernel/ci-base || true)
            fi
            if [[ -z "$diff_base_sha" ]]; then
              echo "resolved=false" >> "$GITHUB_OUTPUT"
              echo "Could not resolve PR merge base; selectors will fail closed."
              exit 0
            fi

            git diff --name-only --no-renames "$diff_base_sha" "$HEAD_SHA" > "$changes_file"
            {
              echo "resolved=true"
              echo "policy_sha=$policy_sha"
              echo "diff_base_sha=$diff_base_sha"
            } >> "$GITHUB_OUTPUT"
            echo "Changed paths use merge base $diff_base_sha; trusted policy uses $BASE_REF at $policy_sha."
            exit 0
          fi

          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "resolved=false" >> "$GITHUB_OUTPUT"
            echo "No usable push base revision; selectors will fail closed."
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > "$changes_file"
          echo "resolved=true" >> "$GITHUB_OUTPUT"

      - name: Select non-native invariant lanes
        id: behavioral
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESOLVED: ${{ steps.changes.outputs.resolved }}
          POLICY_SHA: ${{ steps.changes.outputs.policy_sha }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESOLVED" != "true" ]]; then
            {
              echo "rust=true"
              echo "python=true"
              echo "typescript=true"
              echo "ruby=true"
            } >> "$GITHUB_OUTPUT"
            echo "Changed paths are unresolved; requiring every non-native product lane."
            exit 0
          fi

          selector="$RUNNER_TEMP/behavioral_lanes_required.py"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "${POLICY_SHA:-}" ]] || ! git cat-file -e "$POLICY_SHA:.github/ci/behavioral_lanes_required.py" 2>/dev/null; then
              {
                echo "rust=true"
                echo "python=true"
                echo "typescript=true"
                echo "ruby=true"
              } >> "$GITHUB_OUTPUT"
              echo "Trusted target branch lacks behavioral lane selection; requiring every non-native product lane."
              exit 0
            fi
            git show "$POLICY_SHA:.github/ci/behavioral_lanes_required.py" > "$selector"
            echo "Behavioral lane policy loaded from trusted target at $POLICY_SHA."
          else
            cp .github/ci/behavioral_lanes_required.py "$selector"
          fi

          "$CI_PYTHON" "$selector" --github-output "$GITHUB_OUTPUT" < "$RUNNER_TEMP/searchkernel-changed-paths.txt"

      - name: Select native verifier lane
        id: native
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESOLVED: ${{ steps.changes.outputs.resolved }}
          POLICY_SHA: ${{ steps.changes.outputs.policy_sha }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESOLVED" != "true" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Native verifier required: true (changed paths unresolved)"
            exit 0
          fi

          selector="$RUNNER_TEMP/native_verifier_required.py"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "${POLICY_SHA:-}" ]] || ! git cat-file -e "$POLICY_SHA:.github/ci/native_verifier_required.py" 2>/dev/null; then
              echo "required=true" >> "$GITHUB_OUTPUT"
              echo "Native verifier required: true (trusted target branch lacks selector)"
              exit 0
            fi
            git show "$POLICY_SHA:.github/ci/native_verifier_required.py" > "$selector"
            echo "Native verifier policy loaded from trusted target at $POLICY_SHA."
          else
            cp .github/ci/native_verifier_required.py "$selector"
          fi

          required=$("$CI_PYTHON" "$selector" < "$RUNNER_TEMP/searchkernel-changed-paths.txt")
          if [[ "$required" != "true" && "$required" != "false" ]]; then
            echo "::error::native verifier selector returned invalid value '$required'"
            exit 1
          fi

          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "Native verifier required: $required"

  rust:
    name: Rust invariant
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64]
    env:
      CARGO_TARGET_DIR: target/ci-non-native
      SEARCHKERNEL_BUILD_ENV: ci
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Select runner Python
        run: bash .github/ci/select-python.sh

      - name: Reject stale verification checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ "${actual,,}" != "${EXPECTED_HEAD,,}" ]]; then
            echo "::error title=Stale verification checkout::Expected exact head $EXPECTED_HEAD, checked out $actual. Verification from a different SHA cannot authorize this revision."
            exit 1
          fi
          echo "Verified exact head $actual."

      - name: Verify provisioned Rust toolchain
        run: |
          set -euo pipefail
          command -v cargo
          command -v rustc
          cargo --version
          rustc --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/ci-non-native"
          shared-key: non-native
          cache-bin: false

      - name: Cache pinned FlatBuffers toolchain
        uses: actions/cache@v4
        with:
          path: .git/searchkernel/toolchains/flatbuffers/25.12.19
          key: flatbuffers-25.12.19-${{ runner.os }}-${{ runner.arch }}

      - name: Ensure pinned FlatBuffers toolchain
        run: ./dev install flatbuffers

      - name: Run canonical Rust baseline
        run: cargo test --workspace --all-targets --no-default-features

      - name: Run portable API conformance on the same Rust build
        run: reference/api-conformance/verify.sh

  python:
    name: Python invariant
    needs: classify
    if: needs.classify.outputs.python == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Select runner Python
        run: bash .github/ci/select-python.sh

      - name: Reject stale verification checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ "${actual,,}" != "${EXPECTED_HEAD,,}" ]]; then
            echo "::error title=Stale verification checkout::Expected exact head $EXPECTED_HEAD, checked out $actual. Verification from a different SHA cannot authorize this revision."
            exit 1
          fi
          echo "Verified exact head $actual."

      - name: Verify provisioned Rust toolchain
        run: |
          set -euo pipefail
          command -v cargo
          command -v rustc
          cargo --version
          rustc --version

      - name: Cache pinned FlatBuffers toolchain
        uses: actions/cache@v4
        with:
          path: .git/searchkernel/toolchains/flatbuffers/25.12.19
          key: flatbuffers-25.12.19-${{ runner.os }}-${{ runner.arch }}

      - name: Ensure pinned FlatBuffers toolchain
        run: ./dev install flatbuffers

      - name: Install Python client
        run: $CI_PYTHON -m pip install -e clients/python

      - name: Run Python behavioral tests
        run: $CI_PYTHON -m unittest discover -s clients/python/tests -p 'test_*.py'

  typescript:
    name: TypeScript invariant
    needs: classify
    if: needs.classify.outputs.typescript == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Select runner Python
        run: bash .github/ci/select-python.sh

      - name: Reject stale verification checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ "${actual,,}" != "${EXPECTED_HEAD,,}" ]]; then
            echo "::error title=Stale verification checkout::Expected exact head $EXPECTED_HEAD, checked out $actual. Verification from a different SHA cannot authorize this revision."
            exit 1
          fi
          echo "Verified exact head $actual."

      - name: Verify provisioned Rust toolchain
        run: |
          set -euo pipefail
          command -v cargo
          command -v rustc
          cargo --version
          rustc --version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache pinned FlatBuffers toolchain
        uses: actions/cache@v4
        with:
          path: .git/searchkernel/toolchains/flatbuffers/25.12.19
          key: flatbuffers-25.12.19-${{ runner.os }}-${{ runner.arch }}

      - name: Ensure pinned FlatBuffers toolchain
        run: ./dev install flatbuffers

      - name: Install TypeScript client
        run: npm ci --prefix clients/typescript

      - name: Run TypeScript generation regressions
        run: ./tools/test-typescript-generation.sh

      - name: Generate TypeScript protocol bindings
        run: npm run generate --prefix clients/typescript

      - name: Verify TypeScript generated bindings
        run: npm run check:generated --prefix clients/typescript

      - name: Typecheck TypeScript client
        run: npm --prefix clients/typescript run typecheck

      - name: Run TypeScript behavioral tests
        run: npm --prefix clients/typescript test

      - name: Verify TypeScript package
        run: npm run test:package --prefix clients/typescript

  ruby:
    name: Ruby invariant
    needs: classify
    if: needs.classify.outputs.ruby == 'true'
    runs-on: [self-hosted, linux, x64]
    env:
      CARGO_TARGET_DIR: target/ci-exact-head-ruby
      SEARCHKERNEL_BUILD_ENV: ci
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Ensure provisioned Ruby
        if: ${{ hashFiles('clients/ruby/**') != '' }}
        run: |
          set -euo pipefail
          if ! command -v ruby >/dev/null 2>&1 || ! command -v gem >/dev/null 2>&1; then
            sudo -n apt-get install -y --no-install-recommends ruby-full
          fi
          ruby --version
          gem --version
          ruby -rrubygems -e 'abort "Ruby >= 3.1 is required" if Gem::Version.new(RUBY_VERSION) < Gem::Version.new("3.1")'

      - name: Verify provisioned Rust toolchain
        if: ${{ hashFiles('clients/ruby/**') != '' }}
        run: |
          set -euo pipefail
          command -v cargo
          command -v rustc
          cargo --version
          rustc --version

      - name: Cache Rust build
        if: ${{ hashFiles('clients/ruby/**') != '' }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/ci-exact-head-ruby"
          cache-bin: false
          shared-key: exact-head-ruby

      - name: Cache pinned FlatBuffers toolchain
        if: ${{ hashFiles('clients/ruby/**') != '' }}
        uses: actions/cache@v4
        with:
          path: .git/searchkernel/toolchains/flatbuffers/25.12.19
          key: flatbuffers-25.12.19-${{ runner.os }}-${{ runner.arch }}

      - name: Ensure pinned FlatBuffers toolchain
        if: ${{ hashFiles('clients/ruby/**') != '' }}
        run: ./dev install flatbuffers

      - name: Reject stale verification checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ "${actual,,}" != "${EXPECTED_HEAD,,}" ]]; then
            echo "::error title=Stale verification checkout::Expected exact head $EXPECTED_HEAD, checked out $actual. Verification from a different SHA cannot authorize this revision."
            exit 1
          fi
          echo "Verified exact head $actual."

      - name: Run Ruby behavioral tests
        run: |
          set -euo pipefail
          if [[ ! -d clients/ruby ]]; then
            echo "Ruby client is only pre-registered on this base; no Ruby product surface exists yet."
            exit 0
          fi
          ruby --version
          ./dev test ruby

  tooling:
    name: CI and build-tooling invariant
    needs: classify
    if: needs.classify.outputs.tooling == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Reject stale verification checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ "${actual,,}" != "${EXPECTED_HEAD,,}" ]]; then
            echo "::error title=Stale verification checkout::Expected exact head $EXPECTED_HEAD, checked out $actual. Verification from a different SHA cannot authorize this revision."
            exit 1
          fi
          echo "Verified exact head $actual."

      - name: Validate developer command wrapper
        run: |
          bash -n dev
          bash dev help >/dev/null

      - name: Run native SDK packaging regression
        run: bash tools/test-native-sdk-packaging.sh

      - name: Run native environment fingerprint regression
        run: bash tools/test-native-environment-fingerprint.sh

      - name: Run native SDK cache regression
        run: bash tools/test-native-sdk-cache.sh

      - name: Test Clippy diagnostic runner
        run: python3 tools/test_run_clippy.py

      - name: Run semantic verifier routing regression
        run: bash reference/vespa/verifiers/test-routing.sh

  native:
    name: Native invariant
    needs: classify
    if: needs.classify.outputs.native == 'true'
    uses: superkelvint/searchkernel/.github/workflows/native-verifier-runner.yml@main
    with:
      revision: ${{ github.event.pull_request.head.sha || github.sha }}
      target: native-full

  exact-head-gate:
    name: Invariant gate
    needs: [classify, rust, python, typescript, ruby, tooling, native]
    # Aggregate dependency failures, but do not strand a superseded workflow
    # after GitHub cancels it in favor of a newer PR head.
    if: ${{ always() && !cancelled() }}
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Require every selected invariant lane
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          RUST_REQUIRED: ${{ needs.classify.outputs.rust }}
          RUST_RESULT: ${{ needs.rust.result }}
          PYTHON_REQUIRED: ${{ needs.classify.outputs.python }}
          PYTHON_RESULT: ${{ needs.python.result }}
          TYPESCRIPT_REQUIRED: ${{ needs.classify.outputs.typescript }}
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
          RUBY_REQUIRED: ${{ needs.classify.outputs.ruby }}
          RUBY_RESULT: ${{ needs.ruby.result }}
          TOOLING_REQUIRED: ${{ needs.classify.outputs.tooling }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
          NATIVE_SENSITIVE: ${{ needs.classify.outputs.native }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          set -euo pipefail

          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            echo "::error::Invariant planning failed for $EXPECTED_HEAD."
            exit 1
          fi

          require_lane() {
            local lane=$1
            local required=$2
            local result=$3
            if [[ "$required" == "true" && "$result" != "success" ]]; then
              echo "::error::$lane invariant verification for $EXPECTED_HEAD ended as '$result'."
              exit 1
            fi
          }

          require_lane Rust "$RUST_REQUIRED" "$RUST_RESULT"
          require_lane Python "$PYTHON_REQUIRED" "$PYTHON_RESULT"
          require_lane TypeScript "$TYPESCRIPT_REQUIRED" "$TYPESCRIPT_RESULT"
          require_lane Ruby "$RUBY_REQUIRED" "$RUBY_RESULT"
          require_lane Tooling "$TOOLING_REQUIRED" "$TOOLING_RESULT"
          require_lane Native "$NATIVE_SENSITIVE" "$NATIVE_RESULT"

          echo "All selected invariant verification for exact head $EXPECTED_HEAD passed."
