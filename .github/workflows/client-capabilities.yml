name: Client capabilities

on:
  pull_request:
    paths:
      - "clients/**"
      - "core/crates/searchkernel/**"
      - "core/crates/searchkernel-vespa-engine/**"
      - "docs/capabilities.json"
      - "docs/CAPABILITIES.md"
      - "LIMITATIONS.md"
      - "dev"
      - "docs/CLIENT_CAPABILITIES.md"
      - "docs/client-capabilities.json"
      - "reference/client-contracts/**"
      - "tools/check-capabilities.py"
      - "tools/check-client-contracts.py"
      - "tools/test_check_capabilities.py"
      - "tools/test_check_client_contracts.py"
      - "tools/check-python-dependencies.py"
      - "tools/test_python_dependency_contract.py"
      - ".github/workflows/client-capabilities.yml"
  push:
    branches: [main]
    paths:
      - "clients/**"
      - "core/crates/searchkernel/**"
      - "core/crates/searchkernel-vespa-engine/**"
      - "docs/capabilities.json"
      - "docs/CAPABILITIES.md"
      - "LIMITATIONS.md"
      - "dev"
      - "docs/CLIENT_CAPABILITIES.md"
      - "docs/client-capabilities.json"
      - "reference/client-contracts/**"
      - "tools/check-capabilities.py"
      - "tools/check-client-contracts.py"
      - "tools/test_check_capabilities.py"
      - "tools/test_check_client_contracts.py"
      - "tools/check-python-dependencies.py"
      - "tools/test_python_dependency_contract.py"
      - ".github/workflows/client-capabilities.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python tools/check-capabilities.py --check
      - run: python tools/check-client-contracts.py --check
      - run: python tools/test_check_capabilities.py
      - run: python tools/test_check_client_contracts.py
      - run: python tools/test_python_dependency_contract.py

  e2e:
    name: Executable E2E evidence
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: target/ci
      SEARCHKERNEL_BUILD_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - run: python -m pip install -e clients/python
      - run: python tools/check-python-dependencies.py
      - run: npm ci --prefix clients/typescript
      - run: python tools/check-client-contracts.py --run-e2e

