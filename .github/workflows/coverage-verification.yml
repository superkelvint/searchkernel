name: Coverage verification

on:
  pull_request:
    paths:
      - "dev"
      - "tools/coverage.sh"
      - "tools/run-in-ci-image.sh"
      - "tools/test-dev-ci-image.sh"
      - "docker/searchkernel-ci/Dockerfile"
      - ".github/workflows/ci-image-runner.yml"
      - ".github/workflows/nightly.yml"
      - ".github/workflows/coverage-verification.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  coverage:
    name: Exact-head Rust coverage
    uses: ./.github/workflows/ci-image-runner.yml
    with:
      revision: ${{ github.event.pull_request.head.sha || github.sha }}
      target: nightly-coverage
    secrets: inherit
