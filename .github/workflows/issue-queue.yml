name: Issue queue

# Temporarily disabled from CI/scheduled execution.
# Keep manual dispatch available while the consistency workflow is paused.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  consistency:
    runs-on: [self-hosted, linux, x64]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Select runner Python
        run: bash .github/ci/select-python.sh
      - name: Enforce runner-Python workflow policy
        run: bash .github/ci/check-python-workflows.sh
      - run: python tools/test_check_issue_queue.py
      - run: python tools/check-issue-queue.py --repo "${{ github.repository }}"
