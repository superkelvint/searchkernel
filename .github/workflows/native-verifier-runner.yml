name: Native verifier runner

on:
  workflow_call:
    inputs:
      revision:
        description: Exact commit to verify
        required: true
        type: string
      target:
        description: Native verifier target or fixed native bundle
        required: true
        type: string
  workflow_dispatch:
    inputs:
      revision:
        description: Branch, tag, or commit to verify (blank uses the selected workflow ref)
        required: false
        type: string
      target:
        description: ./dev verify target, native-full, client-e2e, or closure-422
        required: true
        default: integration
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    uses: ./.github/workflows/ci-image-runner.yml
    with:
      revision: ${{ inputs.revision || github.sha }}
      target: ${{ inputs.target }}
    secrets: inherit
