name: Native verifier runner

on:
  workflow_call:
    inputs:
      revision:
        description: Exact commit to verify
        required: true
        type: string
      target:
        description: ./dev verify target, or a fixed native bundle
        required: true
        type: string
  workflow_dispatch:
    inputs:
      revision:
        description: Branch, tag, or commit to verify (blank uses the selected workflow ref)
        required: false
        type: string
      target:
        description: ./dev verify target, or closure-422
        required: true
        default: integration
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: native-verifier-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: ${{ inputs.target }} in searchkernel-ci:latest
    runs-on: [self-hosted, linux, x64]
    env:
      NATIVE_IMAGE: docker.io/superkelvint/searchkernel-ci:latest
    steps:
      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve exact revision
        id: revision
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "Verifying exact SearchKernel revision $actual"

      - name: Pull immutable CI environment candidate
        run: |
          set -euo pipefail
          docker pull "$NATIVE_IMAGE"
          label=$(docker image inspect --format '{{index .Config.Labels "io.searchkernel.vespa-commit"}}' "$NATIVE_IMAGE")
          [[ -n "$label" && "$label" != "<no value>" ]] || {
            echo "::error::CI image is missing io.searchkernel.vespa-commit label"
            exit 1
          }
          digest=$(docker image inspect --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{end}}' "$NATIVE_IMAGE")
          echo "Using $NATIVE_IMAGE"
          echo "Resolved image digest: ${digest:-unknown}"

          docker run --rm "$NATIVE_IMAGE" /bin/bash -lc '
            set -euo pipefail
            test -f /opt/searchkernel/native-validation-pass
            for cmd in cargo rustc rustfmt cargo-clippy c++ flatc flock python3 curl rg gh php ruby nm readelf; do
              command -v "$cmd" >/dev/null || {
                echo "required CI-image command is unavailable: $cmd" >&2
                exit 1
              }
            done
            /usr/bin/python3 -c "import clang.cindex"
            "$PYTHON" -c "import flatbuffers, grpc, google.protobuf"
          '

      - name: Create isolated verifier volumes
        env:
          EXPECTED_HEAD: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail

          SOURCE_VOLUME="searchkernel-native-src-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TARGET_VOLUME="searchkernel-native-target-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CONTAINER_NAME="searchkernel-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          docker volume rm -f "$SOURCE_VOLUME" "$TARGET_VOLUME" >/dev/null 2>&1 || true
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

          docker volume create "$SOURCE_VOLUME" >/dev/null
          docker volume create "$TARGET_VOLUME" >/dev/null
          docker volume create searchkernel-ci-cargo-registry >/dev/null
          docker volume create searchkernel-ci-cargo-git >/dev/null
          docker volume create searchkernel-native-ci-lock >/dev/null

          docker run --rm             -v "$GITHUB_WORKSPACE:/source:ro"             -v "$SOURCE_VOLUME:/work"             "$NATIVE_IMAGE"             /bin/bash -lc 'cp -a /source/. /work/'

          actual=$(docker run --rm             -v "$SOURCE_VOLUME:/work"             -w /work             "$NATIVE_IMAGE"             /bin/bash -lc 'git config --global --add safe.directory /work && git rev-parse HEAD')

          if [[ "${actual,,}" != "${EXPECTED_HEAD,,}" ]]; then
            echo "::error::container copy expected $EXPECTED_HEAD, found $actual"
            exit 1
          fi

          {
            echo "SOURCE_VOLUME=$SOURCE_VOLUME"
            echo "TARGET_VOLUME=$TARGET_VOLUME"
            echo "CONTAINER_NAME=$CONTAINER_NAME"
          } >> "$GITHUB_ENV"

      - name: Run verifier in immutable CI image
        env:
          EXPECTED_HEAD: ${{ steps.revision.outputs.sha }}
          VERIFIER_TARGET: ${{ inputs.target }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          docker run --rm             --name "$CONTAINER_NAME"             --pids-limit=-1             -v "$SOURCE_VOLUME:/work"             -v "$TARGET_VOLUME:/cargo-target"             -v searchkernel-ci-cargo-registry:/root/.cargo/registry             -v searchkernel-ci-cargo-git:/root/.cargo/git             -v searchkernel-native-ci-lock:/native-lock             -w /work             -e EXPECTED_HEAD="$EXPECTED_HEAD"             -e VERIFIER_TARGET="$VERIFIER_TARGET"             -e NATIVE_IMAGE="$NATIVE_IMAGE"             -e GH_TOKEN="$GH_TOKEN"             -e PR_NUMBER="$PR_NUMBER"             -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY"             -e GITHUB_API_URL="$GITHUB_API_URL"             -e SEARCHKERNEL_BUILD_ENV=ci             -e CARGO_TARGET_DIR=/cargo-target             "$NATIVE_IMAGE"             /bin/bash -s <<'BASH'
          set -euo pipefail

          HEAD_CHECK_TOKEN="${GH_TOKEN:-}"
          unset GH_TOKEN

          git config --global --add safe.directory /work
          export PYTHONPATH="/work/clients/python${PYTHONPATH:+:$PYTHONPATH}"

          actual=$(git rev-parse HEAD)
          if [[ "${actual,,}" != "${EXPECTED_HEAD,,}" ]]; then
            echo "expected exact revision $EXPECTED_HEAD in CI image, found $actual" >&2
            exit 1
          fi

          for cmd in cargo rustc rustfmt cargo-clippy c++ flatc flock python3 ldd sha256sum curl rg gh php ruby nm readelf; do
            command -v "$cmd" >/dev/null 2>&1 || {
              echo "required verifier command is unavailable from $NATIVE_IMAGE: $cmd" >&2
              exit 1
            }
          done
          /usr/bin/python3 -c 'import clang.cindex'
          "$PYTHON" -c 'import flatbuffers, grpc, google.protobuf'
          test -f /opt/searchkernel/native-validation-pass

          unset VESPA_ROOT || true
          unset VESPA_LIBRARY_ROOT || true
          unset VESPA_DEPS || true
          unset VESPA_DEPS_LIB_DIR || true
          unset VESPA_DEPS_INCLUDE_DIR || true
          unset VESPA_EXTRA_LIB_DIR || true
          unset VESPA_AWS_LIB_DIR || true
          unset SK_NATIVE_SDK || true
          unset SK_NATIVE_BASE_ARTIFACT_URL || true
          unset SK_NATIVE_BASE_ARTIFACT_GENERATION || true
          unset SEARCHKERNEL_VERIFY_LIVE_ORACLE || true

          native_base=$(./dev native-sdk path)
          case "$native_base" in
            /opt/searchkernel/native-sdk-cache/ci/*/objects/*) ;;
            *)
              echo "CI image resolved native base outside its baked immutable cache: $native_base" >&2
              exit 1
              ;;
          esac
          echo "Using baked native base: $native_base"

          assert_current_pr_head() {
            local phase=$1
            if [[ -z "${PR_NUMBER:-}" ]]; then
              return 0
            fi

            local response current state
            response=$(curl --fail --silent --show-error               --connect-timeout 5               --max-time 15               -H "Authorization: Bearer $HEAD_CHECK_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "${GITHUB_API_URL:-https://api.github.com}/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
            read -r current state < <(
              python3 -c 'import json,sys; data=json.load(sys.stdin); print(data.get("head", {}).get("sha", ""), data.get("state", ""))' <<<"$response"
            )
            if [[ -z "$current" || -z "$state" ]]; then
              echo "::error::could not resolve current head/state for PR #$PR_NUMBER before $phase"
              exit 1
            fi

            if [[ "$state" != "open" ]]; then
              echo "::notice title=Superseded native verification::PR #$PR_NUMBER is $state; stopping obsolete native verification for $EXPECTED_HEAD before $phase."
              exit 0
            fi

            if [[ "${current,,}" != "${EXPECTED_HEAD,,}" ]]; then
              echo "::notice title=Superseded native verification::PR #$PR_NUMBER now points to $current; stopping obsolete native verification for $EXPECTED_HEAD before $phase."
              exit 0
            fi

            echo "PR #$PR_NUMBER still points to $EXPECTED_HEAD before $phase."
          }

          assert_current_pr_head preflight

          exec 9>/native-lock/native-ci.lock
          flock 9

          run_native_phase() {
            local phase=$1
            shift
            assert_current_pr_head "$phase"
            env -u GH_TOKEN "$@"
          }

          build_native_searchkerneld() {
            local phase=$1
            local cargo_messages
            cargo_messages=$(mktemp)

            if ! run_native_phase "$phase" bash -c '
              set -euo pipefail
              cargo build -p searchkerneld --features native \
                --message-format=json-render-diagnostics | tee "$1"
            ' _ "$cargo_messages"; then
              rm -f "$cargo_messages"
              return 1
            fi

            if ! NATIVE_ADAPTER_LIB=$(python3 .github/ci/resolve-native-adapter-lib.py \
              "$cargo_messages" "$CARGO_TARGET_DIR"); then
              rm -f "$cargo_messages"
              return 1
            fi
            rm -f "$cargo_messages"
            export NATIVE_ADAPTER_LIB
          }

          if [[ "$VERIFIER_TARGET" == "closure-422" ]]; then
            export CARGO_TARGET_DIR=/cargo-target/closure-422
            if [[ -e upstream/vespa/.git ||
                  -f upstream/vespa/searchcore/src/tests/proton/documentdb/CMakeFiles/searchcore_embedded_crud_spike_app.dir/link.txt ||
                  -f upstream/vespa/searchcore/src/tests/proton/documentdb/CMakeFiles/searchcore_embedded_crud_spike_app.dir/flags.make ]]; then
              echo "closure-422 requires a checkout with no configured source Vespa tree" >&2
              exit 1
            fi

            published_vespa=$(bash tools/resolve-native-sdk.sh vespa-root)
            case "$published_vespa" in
              /opt/searchkernel/native-sdk-cache/ci/*/toolchains/*/upstream/vespa) ;;
              *)
                echo "closure-422 resolved Vespa outside the image toolchain: $published_vespa" >&2
                exit 1
                ;;
            esac
            [[ -f "$published_vespa/.searchkernel-vespa-artifact.json" ]] || {
              echo "closure-422 image provenance marker is missing: $published_vespa" >&2
              exit 1
            }
          fi

          case "$VERIFIER_TARGET" in
            native-full)
              run_native_phase native-full-abi ./dev verify abi
              run_native_phase native-full-hnsw ./dev verify vespa.nearest-neighbor.hnsw
              run_native_phase native-full-product-integration ./dev verify product.integration
              run_native_phase native-full-rust-real-engine ./dev verify product.rust-real-engine
              run_native_phase native-full-grouping-yql ./dev verify vespa.grouping.yql
              run_native_phase native-full-recovery ./dev verify vespa.recovery
              run_native_phase native-full-phase9 reference/vespa/phase9/verify-phase9.sh
              run_native_phase native-full-python-e2e tools/run-python-native-e2e.sh
              run_native_phase native-full-persistence ./dev verify persistence
              ;;
            client-e2e)
              "$PYTHON" tools/check-python-dependencies.py
              build_native_searchkerneld client-e2e-build
              run_native_phase client-e2e-run env                 SEARCHKERNEL_LOCAL_HOST="$CARGO_TARGET_DIR/debug/searchkerneld"                 SEARCHKERNEL_SDK_LIB="$NATIVE_ADAPTER_LIB"                 "$PYTHON" tools/check-client-contracts.py --run-e2e
              ;;
            closure-422)
              build_native_searchkerneld closure-422-build
              daemon="$CARGO_TARGET_DIR/debug/searchkerneld"
              [[ -x "$daemon" ]] || {
                echo "closure-422 did not produce native searchkerneld: $daemon" >&2
                exit 1
              }

              run_native_phase closure-422-m14 ./dev verify m14
              run_native_phase closure-422-rust-real-engine ./dev verify product.rust-real-engine
              run_native_phase closure-422-integration ./dev verify integration

              "$PYTHON" tools/check-python-dependencies.py
              run_native_phase closure-422-php-e2e env                 SEARCHKERNEL_LOCAL_HOST="$daemon"                 SEARCHKERNEL_SDK_LIB="$NATIVE_ADAPTER_LIB"                 bash clients/php/examples/run_searchkernel_client_api_e2e.sh
              ;;
            *)
              run_native_phase requested-target ./dev verify "$VERIFIER_TARGET"
              ;;
          esac
          BASH

      - name: Remove verifier container and volumes
        if: always()
        run: |
          set +e
          docker rm -f "${CONTAINER_NAME:-searchkernel-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}" >/dev/null 2>&1 || true
          docker volume rm -f             "${SOURCE_VOLUME:-searchkernel-native-src-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"             "${TARGET_VOLUME:-searchkernel-native-target-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"             >/dev/null 2>&1 || true

      - name: Mark evidence scope
        if: always()
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::notice::Manual dispatch provides runner execution evidence only."
          else
            echo "::notice::Native verifier execution was requested by the calling CI workflow; verification-DAG selection remains offline."
          fi
