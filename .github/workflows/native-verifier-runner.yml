name: Native verifier runner

on:
  workflow_call:
    inputs:
      revision:
        description: Exact commit to verify
        required: true
        type: string
      target:
        description: ./dev verify target, or a fixed native bundle
        required: true
        type: string
  workflow_dispatch:
    inputs:
      revision:
        description: Branch, tag, or commit to verify (blank uses the selected workflow ref)
        required: false
        type: string
      target:
        description: ./dev verify target, or closure-422
        required: true
        default: integration
        type: string

permissions:
  contents: read

concurrency:
  group: native-verifier-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: ${{ inputs.target }} on AlmaLinux
    runs-on: [self-hosted, linux, x64]
    env:
      NATIVE_CONTAINER: searchkernel-native
      ALMA_CARGO_TARGET_DIR: /work/target/actions-runner-alma-manual
    steps:
      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve exact revision
        id: revision
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "Verifying exact SearchKernel revision $actual"

      - name: Verify provisioned AlmaLinux native container
        run: |
          set -euo pipefail

          if ! docker container inspect "$NATIVE_CONTAINER" >/dev/null 2>&1; then
            echo "::error::missing persistent AlmaLinux native container '$NATIVE_CONTAINER'"
            echo "::error::run tools/actions-runner-setup.sh once on this runner"
            exit 1
          fi

          if [[ "$(docker inspect --format '{{.State.Running}}' "$NATIVE_CONTAINER")" != "true" ]]; then
            docker start "$NATIVE_CONTAINER" >/dev/null
          fi

          mounts=$(docker inspect --format '{{range .Mounts}}{{println .Destination}}{{end}}' "$NATIVE_CONTAINER")
          for required in /work /native-artifacts /root/.cargo /root/.rustup /root/.cache/searchkernel; do
            if ! grep -Fxq "$required" <<<"$mounts"; then
              echo "::error::native container '$NATIVE_CONTAINER' is missing required mount $required"
              echo "::error::rerun tools/actions-runner-setup.sh on this runner"
              exit 1
            fi
          done

          artifact_mount_rw=$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/native-artifacts"}}{{.RW}}{{end}}{{end}}' "$NATIVE_CONTAINER")
          if [[ "$artifact_mount_rw" != "false" ]]; then
            echo "::error::native artifact mount must be read-only, found RW=$artifact_mount_rw"
            exit 1
          fi

      - name: Copy exact revision into AlmaLinux
        env:
          EXPECTED_HEAD: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail

          if git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo "::error::refusing to copy a checkout containing persisted GitHub credentials"
            exit 1
          fi

          ALMA_WORKTREE="/tmp/searchkernel-verifier-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker exec "$NATIVE_CONTAINER" rm -rf "$ALMA_WORKTREE"
          docker exec "$NATIVE_CONTAINER" mkdir -p "$ALMA_WORKTREE"
          docker cp "$GITHUB_WORKSPACE/." "$NATIVE_CONTAINER:$ALMA_WORKTREE"

          actual=$(docker exec             -e ALMA_WORKTREE="$ALMA_WORKTREE"             "$NATIVE_CONTAINER"             /bin/bash -lc 'git -c safe.directory="$ALMA_WORKTREE" -C "$ALMA_WORKTREE" rev-parse HEAD')
          if [[ "${actual,,}" != "${EXPECTED_HEAD,,}" ]]; then
            echo "::error::AlmaLinux copy expected $EXPECTED_HEAD, found $actual"
            exit 1
          fi

          echo "ALMA_WORKTREE=$ALMA_WORKTREE" >> "$GITHUB_ENV"

      - name: Resolve trusted native-base release
        id: native_base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null
          command -v rustc >/dev/null

          pin=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["vespa_commit"])' core/native/vespa/manifest.json)
          target=$(rustc -vV | sed -n 's/^host: //p')
          [[ -n "$target" ]] || {
            echo "::error::could not determine host Rust target for native-base selection"
            exit 1
          }

          latest_generation=
          while IFS=        run: |
          set -euo pipefail

          docker exec -i             -e ALMA_WORKTREE="$ALMA_WORKTREE"             -e EXPECTED_HEAD="$EXPECTED_HEAD"             -e VERIFIER_TARGET="$VERIFIER_TARGET"             -e EXPECTED_NATIVE_ARCHIVE_NAME="$EXPECTED_NATIVE_ARCHIVE_NAME"             -e EXPECTED_NATIVE_ARCHIVE_SHA256="$EXPECTED_NATIVE_ARCHIVE_SHA256"             -e SEARCHKERNEL_BUILD_ENV=ci             -e CARGO_TARGET_DIR="$ALMA_CARGO_TARGET_DIR"             "$NATIVE_CONTAINER"             /bin/bash -s <<'BASH'
          set -euo pipefail

          export PATH="/root/.cargo/bin:/opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          export LD_LIBRARY_PATH="/opt/rh/gcc-toolset-15/root/usr/lib64:/opt/rh/gcc-toolset-15/root/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          # Keep exact-head verification hermetic from runner-global Cargo
          # configuration. In particular, a stale [env] SK_NATIVE_SDK entry in
          # /root/.cargo/config* must not make Cargo treat the verifier-owned
          # adapter SDK as an explicit full SDK. Reuse only the expensive
          # registry/git caches from the persistent runner.
          export CARGO_HOME="$ALMA_WORKTREE/.cargo-home"
          mkdir -p "$CARGO_HOME"
          for cache in registry git; do
            if [[ -e "/root/.cargo/$cache" && ! -e "$CARGO_HOME/$cache" ]]; then
              ln -s "/root/.cargo/$cache" "$CARGO_HOME/$cache"
            fi
          done

          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=safe.directory
          export GIT_CONFIG_VALUE_0="$ALMA_WORKTREE"

          cd "$ALMA_WORKTREE"

          # Client-side verifier helpers must import from the exact copied
          # revision, not from an editable package or PYTHONPATH rooted at the
          # persistent runner checkout mounted at /work.
          export PYTHONPATH="$ALMA_WORKTREE/clients/python${PYTHONPATH:+:$PYTHONPATH}"

          actual=$(git rev-parse HEAD)
          if [[ "${actual,,}" != "${EXPECTED_HEAD,,}" ]]; then
            echo "expected exact revision $EXPECTED_HEAD in AlmaLinux, found $actual" >&2
            exit 1
          fi

          for cmd in cargo rustc c++ flatc flock python3 ldd; do
            command -v "$cmd" >/dev/null 2>&1 || {
              echo "required verifier command is unavailable: $cmd" >&2
              exit 1
            }
          done

          if ! command -v rg >/dev/null 2>&1; then
            dnf install -y epel-release
            dnf install -y ripgrep
          fi
          if ! command -v nm >/dev/null 2>&1 || ! command -v readelf >/dev/null 2>&1; then
            dnf install -y binutils
          fi
          if ! command -v clang >/dev/null 2>&1 || ! python3 -c 'import clang.cindex' >/dev/null 2>&1; then
            dnf install -y clang python3-clang
          fi
          command -v clang >/dev/null
          python3 -c 'import clang.cindex' >/dev/null
          rustup component add rustfmt clippy >/dev/null

          unset VESPA_ROOT || true
          unset VESPA_LIBRARY_ROOT || true
          unset VESPA_DEPS || true
          unset VESPA_DEPS_LIB_DIR || true
          unset VESPA_DEPS_INCLUDE_DIR || true
          unset VESPA_EXTRA_LIB_DIR || true
          unset VESPA_AWS_LIB_DIR || true
          unset SK_NATIVE_SDK || true
          unset SEARCHKERNEL_VERIFY_LIVE_ORACLE || true

          if [[ "$VERIFIER_TARGET" == "closure-422" ]]; then
            # #422 acceptance is deliberately cold. Persistent Cargo/rustup
            # downloads may be reused, but native-base objects and candidate
            # build outputs must start empty and disappear with ALMA_WORKTREE.
            export SK_NATIVE_CACHE_DIR="$ALMA_WORKTREE/.native-cache"
            export CARGO_TARGET_DIR="$ALMA_WORKTREE/target/closure-422"
            rm -rf "$SK_NATIVE_CACHE_DIR" "$CARGO_TARGET_DIR"
            [[ ! -e "$SK_NATIVE_CACHE_DIR" ]]
            if [[ -e upstream/vespa/.git ||
                  -f upstream/vespa/searchcore/src/tests/proton/documentdb/CMakeFiles/searchcore_embedded_crud_spike_app.dir/link.txt ||
                  -f upstream/vespa/searchcore/src/tests/proton/documentdb/CMakeFiles/searchcore_embedded_crud_spike_app.dir/flags.make ]]; then
              echo "closure-422 requires a checkout with no configured source Vespa tree" >&2
              exit 1
            fi
          fi

          pin=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["vespa_commit"])' core/native/vespa/manifest.json)
          target=$(rustc -vV | sed -n 's/^host: //p')
          artifact="/native-artifacts/$EXPECTED_NATIVE_ARCHIVE_NAME"
          if [[ ! -s "$artifact" || ! -s "${artifact}.sha256" ]]; then
            echo "trusted native base is not staged in /native-artifacts: $artifact" >&2
            echo "rerun tools/actions-runner-setup.sh on this runner after publishing the base" >&2
            exit 1
          fi

          staged_sha=$(awk 'NF {print $1; exit}' "${artifact}.sha256")
          actual_sha=$(sha256sum "$artifact" | awk '{print $1}')
          if [[ "${staged_sha,,}" != "$EXPECTED_NATIVE_ARCHIVE_SHA256" ||
                "${actual_sha,,}" != "$EXPECTED_NATIVE_ARCHIVE_SHA256" ]]; then
            echo "native base digest does not match trusted release identity for $artifact" >&2
            echo "trusted=$EXPECTED_NATIVE_ARCHIVE_SHA256 staged=$staged_sha actual=$actual_sha" >&2
            exit 1
          fi

          case "$EXPECTED_NATIVE_ARCHIVE_NAME" in
            searchkernel-vespa-base-v*-ci-${target}-${pin}.tar.gz) ;;
            *)
              echo "trusted native base name does not match candidate pin/target: $EXPECTED_NATIVE_ARCHIVE_NAME" >&2
              exit 1
              ;;
          esac

          echo "Using trusted native base artifact: $artifact"
          export SK_NATIVE_BASE_ARTIFACT_URL="file://$artifact"

          exec 9>/tmp/searchkernel-native-ci.lock
          flock 9

          ./dev native-sdk ensure

          if [[ "$VERIFIER_TARGET" == "closure-422" ]]; then
            published_vespa=$(bash tools/resolve-native-sdk.sh vespa-root)
            case "$published_vespa" in
              "$SK_NATIVE_CACHE_DIR"/*/toolchains/*/upstream/vespa) ;;
              *)
                echo "closure-422 resolved Vespa outside the isolated published cache: $published_vespa" >&2
                exit 1
                ;;
            esac
            [[ -f "$published_vespa/.searchkernel-vespa-artifact.json" ]] || {
              echo "closure-422 published provenance marker is missing: $published_vespa" >&2
              exit 1
            }
          fi

          case "$VERIFIER_TARGET" in
            native-full)
              # Fixed CI bundle while verification-DAG authorization is offline.
              # Keep this aligned with the native semantic closure, but do not
              # load or classify through verification/dag.toml here.
              ./dev verify abi
              ./dev verify vespa.nearest-neighbor.hnsw
              ./dev verify product.integration
              ./dev verify product.rust-real-engine
              ./dev verify vespa.grouping.yql
              ./dev verify vespa.recovery
              reference/vespa/phase9/verify-phase9.sh
              tools/run-python-native-e2e.sh
              ./dev verify persistence
              ;;
            closure-422)
              cargo build -p searchkerneld --features native
              daemon="$CARGO_TARGET_DIR/debug/searchkerneld"
              [[ -x "$daemon" ]] || {
                echo "closure-422 did not produce native searchkerneld: $daemon" >&2
                exit 1
              }

              ./dev verify m14
              ./dev verify product.rust-real-engine
              ./dev verify integration

              command -v php >/dev/null
              python3 tools/check-python-dependencies.py
              export PYTHONPATH="$ALMA_WORKTREE/clients/python${PYTHONPATH:+:$PYTHONPATH}"
              SEARCHKERNEL_LOCAL_HOST="$daemon" \
                bash clients/php/examples/run_searchkernel_client_api_e2e.sh
              ;;
            *)
              ./dev verify "$VERIFIER_TARGET"
              ;;
          esac
          BASH

      - name: Remove exact-revision container copy
        if: always()
        run: |
          set +e
          ALMA_WORKTREE="${ALMA_WORKTREE:-/tmp/searchkernel-verifier-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          docker exec "$NATIVE_CONTAINER" rm -rf "$ALMA_WORKTREE" >/dev/null 2>&1 || true

      - name: Mark evidence scope
        if: always()
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::notice::Manual dispatch provides runner execution evidence only."
          else
            echo "::notice::Native verifier execution was requested by the calling CI workflow; verification-DAG selection remains offline."
          fi
\t' read -r tag draft prerelease; do
            [[ "$draft" == "false" && "$prerelease" == "false" ]] || continue
            if [[ "$tag" =~ ^vespa-base-v([0-9]+)-ci-${target}-${pin}$ ]]; then
              generation="${BASH_REMATCH[1]}"
              if [[ -z "$latest_generation" || "$generation" -gt "$latest_generation" ]]; then
                latest_generation="$generation"
              fi
            fi
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | [.tag_name, (.draft|tostring), (.prerelease|tostring)] | @tsv')

          [[ -n "$latest_generation" ]] || {
            echo "::error::no published CI native base for Vespa $pin and target $target"
            exit 1
          }

          tag="vespa-base-v${latest_generation}-ci-${target}-${pin}"
          archive="searchkernel-vespa-base-v${latest_generation}-ci-${target}-${pin}.tar.gz"
          assets=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.assets[].name')
          grep -Fxq "$archive" <<<"$assets" || {
            echo "::error::trusted release $tag is missing $archive"
            exit 1
          }
          grep -Fxq "${archive}.sha256" <<<"$assets" || {
            echo "::error::trusted release $tag is missing ${archive}.sha256"
            exit 1
          }

          checksum_dir="${RUNNER_TEMP}/searchkernel-native-base-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$checksum_dir"
          mkdir -p "$checksum_dir"
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${archive}.sha256" \
            --dir "$checksum_dir"

          expected_sha=$(awk 'NF {print $1; exit}' "$checksum_dir/${archive}.sha256")
          [[ "$expected_sha" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo "::error::trusted release checksum is malformed for $archive"
            exit 1
          }

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=${expected_sha,,}" >> "$GITHUB_OUTPUT"

      - name: Run verifier in AlmaLinux
        env:
          EXPECTED_HEAD: ${{ steps.revision.outputs.sha }}
          VERIFIER_TARGET: ${{ inputs.target }}
          EXPECTED_NATIVE_ARCHIVE_NAME: ${{ steps.native_base.outputs.archive }}
          EXPECTED_NATIVE_ARCHIVE_SHA256: ${{ steps.native_base.outputs.sha256 }}
        run: |
          set -euo pipefail

          docker exec -i             -e ALMA_WORKTREE="$ALMA_WORKTREE"             -e EXPECTED_HEAD="$EXPECTED_HEAD"             -e VERIFIER_TARGET="$VERIFIER_TARGET"             -e SEARCHKERNEL_BUILD_ENV=ci             -e CARGO_TARGET_DIR="$ALMA_CARGO_TARGET_DIR"             "$NATIVE_CONTAINER"             /bin/bash -s <<'BASH'
          set -euo pipefail

          export PATH="/root/.cargo/bin:/opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          export LD_LIBRARY_PATH="/opt/rh/gcc-toolset-15/root/usr/lib64:/opt/rh/gcc-toolset-15/root/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          # Keep exact-head verification hermetic from runner-global Cargo
          # configuration. In particular, a stale [env] SK_NATIVE_SDK entry in
          # /root/.cargo/config* must not make Cargo treat the verifier-owned
          # adapter SDK as an explicit full SDK. Reuse only the expensive
          # registry/git caches from the persistent runner.
          export CARGO_HOME="$ALMA_WORKTREE/.cargo-home"
          mkdir -p "$CARGO_HOME"
          for cache in registry git; do
            if [[ -e "/root/.cargo/$cache" && ! -e "$CARGO_HOME/$cache" ]]; then
              ln -s "/root/.cargo/$cache" "$CARGO_HOME/$cache"
            fi
          done

          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=safe.directory
          export GIT_CONFIG_VALUE_0="$ALMA_WORKTREE"

          cd "$ALMA_WORKTREE"

          # Client-side verifier helpers must import from the exact copied
          # revision, not from an editable package or PYTHONPATH rooted at the
          # persistent runner checkout mounted at /work.
          export PYTHONPATH="$ALMA_WORKTREE/clients/python${PYTHONPATH:+:$PYTHONPATH}"

          actual=$(git rev-parse HEAD)
          if [[ "${actual,,}" != "${EXPECTED_HEAD,,}" ]]; then
            echo "expected exact revision $EXPECTED_HEAD in AlmaLinux, found $actual" >&2
            exit 1
          fi

          for cmd in cargo rustc c++ flatc flock python3 ldd; do
            command -v "$cmd" >/dev/null 2>&1 || {
              echo "required verifier command is unavailable: $cmd" >&2
              exit 1
            }
          done

          if ! command -v rg >/dev/null 2>&1; then
            dnf install -y epel-release
            dnf install -y ripgrep
          fi
          if ! command -v nm >/dev/null 2>&1 || ! command -v readelf >/dev/null 2>&1; then
            dnf install -y binutils
          fi
          if ! command -v clang >/dev/null 2>&1 || ! python3 -c 'import clang.cindex' >/dev/null 2>&1; then
            dnf install -y clang python3-clang
          fi
          command -v clang >/dev/null
          python3 -c 'import clang.cindex' >/dev/null
          rustup component add rustfmt clippy >/dev/null

          unset VESPA_ROOT || true
          unset VESPA_LIBRARY_ROOT || true
          unset VESPA_DEPS || true
          unset VESPA_DEPS_LIB_DIR || true
          unset VESPA_DEPS_INCLUDE_DIR || true
          unset VESPA_EXTRA_LIB_DIR || true
          unset VESPA_AWS_LIB_DIR || true
          unset SK_NATIVE_SDK || true
          unset SEARCHKERNEL_VERIFY_LIVE_ORACLE || true

          if [[ "$VERIFIER_TARGET" == "closure-422" ]]; then
            # #422 acceptance is deliberately cold. Persistent Cargo/rustup
            # downloads may be reused, but native-base objects and candidate
            # build outputs must start empty and disappear with ALMA_WORKTREE.
            export SK_NATIVE_CACHE_DIR="$ALMA_WORKTREE/.native-cache"
            export CARGO_TARGET_DIR="$ALMA_WORKTREE/target/closure-422"
            rm -rf "$SK_NATIVE_CACHE_DIR" "$CARGO_TARGET_DIR"
            [[ ! -e "$SK_NATIVE_CACHE_DIR" ]]
            if [[ -e upstream/vespa/.git ||
                  -f upstream/vespa/searchcore/src/tests/proton/documentdb/CMakeFiles/searchcore_embedded_crud_spike_app.dir/link.txt ||
                  -f upstream/vespa/searchcore/src/tests/proton/documentdb/CMakeFiles/searchcore_embedded_crud_spike_app.dir/flags.make ]]; then
              echo "closure-422 requires a checkout with no configured source Vespa tree" >&2
              exit 1
            fi
          fi

          pin=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["vespa_commit"])' core/native/vespa/manifest.json)
          target=$(rustc -vV | sed -n 's/^host: //p')
          artifact=$(find /native-artifacts -maxdepth 1 -type f -name "searchkernel-vespa-base-v*-ci-${target}-${pin}.tar.gz" -print | sort -V | tail -n 1)
          if [[ -z "$artifact" || ! -s "$artifact" || ! -s "${artifact}.sha256" ]]; then
            echo "no staged published CI native base for Vespa $pin and target $target" >&2
            echo "run tools/actions-runner-setup.sh on this runner after publishing the base" >&2
            exit 1
          fi

          expected_sha=$(awk 'NF {print $1; exit}' "${artifact}.sha256")
          actual_sha=$(sha256sum "$artifact" | awk '{print $1}')
          if [[ -z "$expected_sha" || "$actual_sha" != "$expected_sha" ]]; then
            echo "native base checksum mismatch for $artifact" >&2
            exit 1
          fi

          echo "Using native base artifact: $artifact"
          export SK_NATIVE_BASE_ARTIFACT_URL="file://$artifact"

          exec 9>/tmp/searchkernel-native-ci.lock
          flock 9

          ./dev native-sdk ensure

          if [[ "$VERIFIER_TARGET" == "closure-422" ]]; then
            published_vespa=$(bash tools/resolve-native-sdk.sh vespa-root)
            case "$published_vespa" in
              "$SK_NATIVE_CACHE_DIR"/*/toolchains/*/upstream/vespa) ;;
              *)
                echo "closure-422 resolved Vespa outside the isolated published cache: $published_vespa" >&2
                exit 1
                ;;
            esac
            [[ -f "$published_vespa/.searchkernel-vespa-artifact.json" ]] || {
              echo "closure-422 published provenance marker is missing: $published_vespa" >&2
              exit 1
            }
          fi

          case "$VERIFIER_TARGET" in
            native-full)
              # Fixed CI bundle while verification-DAG authorization is offline.
              # Keep this aligned with the native semantic closure, but do not
              # load or classify through verification/dag.toml here.
              ./dev verify abi
              ./dev verify vespa.nearest-neighbor.hnsw
              ./dev verify product.integration
              ./dev verify product.rust-real-engine
              ./dev verify vespa.grouping.yql
              ./dev verify vespa.recovery
              reference/vespa/phase9/verify-phase9.sh
              tools/run-python-native-e2e.sh
              ./dev verify persistence
              ;;
            closure-422)
              cargo build -p searchkerneld --features native
              daemon="$CARGO_TARGET_DIR/debug/searchkerneld"
              [[ -x "$daemon" ]] || {
                echo "closure-422 did not produce native searchkerneld: $daemon" >&2
                exit 1
              }

              ./dev verify m14
              ./dev verify product.rust-real-engine
              ./dev verify integration

              command -v php >/dev/null
              python3 tools/check-python-dependencies.py
              export PYTHONPATH="$ALMA_WORKTREE/clients/python${PYTHONPATH:+:$PYTHONPATH}"
              SEARCHKERNEL_LOCAL_HOST="$daemon" \
                bash clients/php/examples/run_searchkernel_client_api_e2e.sh
              ;;
            *)
              ./dev verify "$VERIFIER_TARGET"
              ;;
          esac
          BASH

      - name: Remove exact-revision container copy
        if: always()
        run: |
          set +e
          ALMA_WORKTREE="${ALMA_WORKTREE:-/tmp/searchkernel-verifier-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          docker exec "$NATIVE_CONTAINER" rm -rf "$ALMA_WORKTREE" >/dev/null 2>&1 || true

      - name: Mark evidence scope
        if: always()
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::notice::Manual dispatch provides runner execution evidence only."
          else
            echo "::notice::Native verifier execution was requested by the calling CI workflow; verification-DAG selection remains offline."
          fi
