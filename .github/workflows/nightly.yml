name: Nightly comprehensive verification

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: nightly-comprehensive
  cancel-in-progress: false


jobs:
  universe:
    name: Full ./dev universe
    uses: ./.github/workflows/ci-image-runner.yml
    with:
      revision: ${{ github.sha }}
      target: nightly-universe
    secrets: inherit

  rust:
    name: Rust all-target verification
    uses: ./.github/workflows/ci-image-runner.yml
    with:
      revision: ${{ github.sha }}
      target: nightly-rust
    secrets: inherit

  coverage:
    name: Rust code coverage
    uses: ./.github/workflows/ci-image-runner.yml
    with:
      revision: ${{ github.sha }}
      target: nightly-coverage
    secrets: inherit

  contracts:
    name: Contracts and generated artifacts
    uses: ./.github/workflows/ci-image-runner.yml
    with:
      revision: ${{ github.sha }}
      target: nightly-contracts
    secrets: inherit

  client-e2e:
    name: Client executable E2E evidence
    uses: ./.github/workflows/ci-image-runner.yml
    with:
      revision: ${{ github.sha }}
      target: nightly-client-e2e
    secrets: inherit

  abi:
    name: ABI and native-cache regression tests
    uses: ./.github/workflows/ci-image-runner.yml
    with:
      revision: ${{ github.sha }}
      target: nightly-abi
    secrets: inherit
