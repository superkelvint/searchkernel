name: On-demand verification

run-name: >-
  ${{ github.event_name == 'repository_dispatch'
      && format('{0} {1} @ {2} [{3}]', github.event.client_payload.operation, github.event.client_payload.target, github.event.client_payload.revision, github.event.client_payload.request_id)
      || format('comment verification #{0} [{1}]', github.event.issue.number, github.event.comment.id) }}

on:
  repository_dispatch:
    types: [searchkernel-verification]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  status-comment:
    name: update exact-SHA verification status
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      startsWith(github.event.comment.body, '/searchkernel-verify ')
    outputs:
      comment_id: ${{ steps.announce.outputs.comment_id }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Update running verification status
        id: announce
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const runId = process.env.GITHUB_RUN_ID;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            const request = String(context.payload.comment?.body || "").replaceAll("`", "\\`");
            const requestCommentId = Number(context.payload.comment?.id || 0);
            const fields = String(context.payload.comment?.body || "").trim().split(/\s+/);
            const operation = fields[1] || "";
            const target = operation === "ci" ? "" : (fields[2] || "");
            const command = operation === "ci"
              ? "./dev ci"
              : (operation && target ? `./dev ${operation} ${target}` : "verification request");
            const laneMarker = `<!-- searchkernel-verification:${operation}:${target} -->`;
            const requestMarker = `<!-- searchkernel-verification-request:${requestCommentId} -->`;
            const body = [
              laneMarker,
              requestMarker,
              `### ⏳ \`${command}\` — RUNNING`,
              "",
              `- Exact-head request: \`${request}\``,
              `- Run: [View Actions run](${runUrl}) (run ${runId})`,
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            // Prefer the sticky lane comment. For PRs created before this
            // behavior existed, adopt the newest legacy bot status for the same
            // command instead of adding yet another comment.
            let statusComment = comments
              .filter((comment) =>
                comment.user?.login === "github-actions[bot]" &&
                String(comment.body || "").includes(laneMarker)
              )
              .sort((left, right) => Number(right.id) - Number(left.id))[0];

            if (!statusComment) {
              statusComment = comments
                .filter((comment) =>
                  comment.user?.login === "github-actions[bot]" &&
                  String(comment.body || "").includes(`\`${command}\``) &&
                  String(comment.body || "").includes("Exact-head request:") &&
                  String(comment.body || "").includes("View Actions run")
                )
                .sort((left, right) => Number(right.id) - Number(left.id))[0];
            }

            if (statusComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: Number(statusComment.id),
                body,
              });
              core.setOutput("comment_id", String(statusComment.id));
            } else {
              const { data: comment } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.setOutput("comment_id", String(comment.id));
            }

  verify:
    name: exact-SHA verification
    needs: status-comment
    if: >-
      always() &&
      (
        github.event_name == 'repository_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR') &&
        startsWith(github.event.comment.body, '/searchkernel-verify ')
      )
      )
    outputs:
      requested_revision: ${{ steps.request.outputs.revision }}
      observed_revision: ${{ steps.subject.outputs.sha }}
      request_id: ${{ steps.request.outputs.request_id }}
      canonical_command: ${{ steps.evidence.outputs.canonical_command }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120

    steps:
      - name: Prove trusted default-branch control plane
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          expected="refs/heads/${DEFAULT_BRANCH}"
          if [[ "${GITHUB_REF}" != "${expected}" ]]; then
            echo "error: on-demand control plane is not running from ${expected}: ${GITHUB_REF}" >&2
            exit 2
          fi

      - name: Check out trusted control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Normalize and validate authorized request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REVISION: ${{ github.event.client_payload.revision }}
          DISPATCH_OPERATION: ${{ github.event.client_payload.operation }}
          DISPATCH_TARGET: ${{ github.event.client_payload.target }}
          DISPATCH_REQUEST_ID: ${{ github.event.client_payload.request_id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          PULL_REQUEST_URL: ${{ github.event.issue.pull_request.url }}
        run: |
          bash "${GITHUB_WORKSPACE}/control/tools/normalize-verification-request.sh"

      - name: Verify requested commit belongs to this repository
        uses: actions/github-script@v9
        env:
          REVISION: ${{ steps.request.outputs.revision }}
        with:
          script: |
            const revision = process.env.REVISION.toLowerCase();
            try {
              const { data: commit } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: revision,
              });
              if (commit.sha.toLowerCase() !== revision) {
                core.setFailed(`requested commit ${revision} resolved to ${commit.sha}`);
              }
            } catch (error) {
              core.setFailed(`requested revision ${revision} is unavailable from this repository: ${error.message}`);
            }

      - name: Check out requested revision as untrusted subject
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.request.outputs.revision }}
          path: subject
          # The canonical launcher bundles the exact subject commit for Docker;
          # parent objects are needed, so fetch full history instead of a
          # shallow checkout.
          fetch-depth: 0
          persist-credentials: false

      - name: Prove checked-out revision
        id: subject
        shell: bash
        working-directory: subject
        env:
          REVISION: ${{ steps.request.outputs.revision }}
        run: |
          set -euo pipefail
          requested=$(printf '%s' "${REVISION}" | tr '[:upper:]' '[:lower:]')
          observed=$(git rev-parse HEAD)
          if [[ "${observed}" != "${requested}" ]]; then
            echo "error: requested revision ${requested}, checked out ${observed}" >&2
            exit 2
          fi
          printf 'sha=%s\n' "${observed}" >> "${GITHUB_OUTPUT}"

      - name: Validate target against repository authority
        id: target
        shell: bash
        working-directory: subject
        env:
          OPERATION: ${{ steps.request.outputs.operation }}
          REQUESTED_TARGET: ${{ steps.request.outputs.target }}
        run: |
          set -euo pipefail
          if [[ "${OPERATION}" == "ci" ]]; then
            printf 'target=\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # Never dereference a path from the untrusted checkout on the host.
          # Read the registry directly from the proven Git tree and require the
          # tree entry to be an ordinary file rather than a symlink.
          tree_entry=$(git ls-tree HEAD -- build/targets.json)
          read -r registry_mode registry_type registry_object registry_path <<< "${tree_entry}"
          if [[ "${registry_mode}" != "100644" ||
                "${registry_type}" != "blob" ||
                "${registry_path}" != "build/targets.json" ]]; then
            echo "error: build/targets.json must be an ordinary tracked file" >&2
            exit 2
          fi
          registry_size=$(git cat-file -s "${registry_object}")
          if (( registry_size > 1048576 )); then
            echo "error: build/targets.json exceeds the 1 MiB dispatch-validation limit" >&2
            exit 2
          fi

          canonical=$(
            git show HEAD:build/targets.json |
              python3 -c '
          import json
          import os
          import sys

          operation = os.environ["OPERATION"]
          requested = os.environ["REQUESTED_TARGET"]
          if operation not in {"test", "verify"}:
              raise SystemExit(f"unsupported operation: {operation}")

          def reject_duplicates(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate key: {key}")
                  result[key] = value
              return result

          registry = json.load(sys.stdin, object_pairs_hook=reject_duplicates)
          entries = registry.get(operation)
          if not isinstance(entries, dict):
              raise SystemExit(f"registry has no {operation!r} target map")

          for target, metadata in entries.items():
              aliases = metadata.get("aliases", []) if isinstance(metadata, dict) else []
              if requested == target or requested in aliases:
                  print(target)
                  break
          else:
              raise SystemExit(
                  f"unknown {operation} target: {requested}; "
                  f"inspect build/targets.json for supported targets"
              )
          '
          )
          if [[ ! "${canonical}" =~ ^[A-Za-z0-9._-]{1,128}$ ]]; then
            echo "error: resolved target is not a safe canonical identifier" >&2
            exit 2
          fi
          printf 'target=%s\n' "${canonical}" >> "${GITHUB_OUTPUT}"

      - name: Run canonical verification
        id: execute
        shell: bash
        env:
          OPERATION: ${{ steps.request.outputs.operation }}
          CANONICAL_TARGET: ${{ steps.target.outputs.target }}
          SEARCHKERNEL_CI_SOURCE_ROOT: ${{ github.workspace }}/subject
          SEARCHKERNEL_CI_EPHEMERAL_TARGET: "1"
          SEARCHKERNEL_CI_EXACT_SOURCE: "1"
        run: |
          set -euo pipefail
          if [[ "${OPERATION}" == "ci" ]]; then
            echo 'canonical command: ./dev ci'
            bash "${GITHUB_WORKSPACE}/control/tools/run-in-ci-image.sh" ci
          else
            printf 'canonical command: ./dev %q %q\n' "${OPERATION}" "${CANONICAL_TARGET}"
            bash "${GITHUB_WORKSPACE}/control/tools/run-in-ci-image.sh" "${OPERATION}" "${CANONICAL_TARGET}"
          fi

      - name: Write structured evidence
        id: evidence
        if: always()
        shell: bash
        env:
          REQUESTED_REVISION: ${{ steps.request.outputs.revision }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          OBSERVED_REVISION: ${{ steps.subject.outputs.sha }}
          OPERATION: ${{ steps.request.outputs.operation }}
          CANONICAL_TARGET: ${{ steps.target.outputs.target }}
          RESULT: ${{ steps.execute.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/searchkernel-verification"
          mkdir -p "${evidence_dir}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          operation = os.environ["OPERATION"]
          target = os.environ.get("CANONICAL_TARGET", "")
          if operation == "ci":
              canonical_command = "./dev ci"
          elif target:
              canonical_command = f"./dev {operation} {target}"
          else:
              canonical_command = ""
          evidence = {
              "requested_revision": os.environ["REQUESTED_REVISION"].lower(),
              "request_id": os.environ["REQUEST_ID"],
              "revision": os.environ.get("OBSERVED_REVISION", ""),
              "operation": operation,
              "target": target,
              "canonical_command": canonical_command,
              "result": os.environ.get("RESULT") or "not-run",
              "actor": os.environ["ACTOR"],
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "run_url": (
                  f"{os.environ['SERVER_URL']}/{os.environ['REPOSITORY']}"
                  f"/actions/runs/{os.environ['RUN_ID']}"
              ),
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "searchkernel-verification" / "evidence.json"
          path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(path.read_text(encoding="utf-8"))
          PY

          if [[ "${OPERATION}" == "ci" ]]; then
            canonical_command="./dev ci"
          elif [[ -n "${CANONICAL_TARGET}" ]]; then
            canonical_command="./dev ${OPERATION} ${CANONICAL_TARGET}"
          else
            canonical_command=
          fi
          printf 'canonical_command=%s\n' "${canonical_command}" >> "${GITHUB_OUTPUT}"

          {
            echo '### On-demand verification evidence'
            echo
            echo '~~~json'
            cat "${evidence_dir}/evidence.json"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload structured evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/searchkernel-verification/evidence.json
          if-no-files-found: error
          retention-days: 14

  report-comment:
    name: report exact-SHA verification
    needs: [status-comment, verify]
    if: >-
      always() &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      startsWith(github.event.comment.body, '/searchkernel-verify ')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Update verification status
        uses: actions/github-script@v9
        env:
          REQUESTED_REVISION: ${{ needs.verify.outputs.requested_revision }}
          OBSERVED_REVISION: ${{ needs.verify.outputs.observed_revision }}
          REQUEST_ID: ${{ needs.verify.outputs.request_id }}
          CANONICAL_COMMAND: ${{ needs.verify.outputs.canonical_command }}
          VERIFICATION_RESULT: ${{ needs.verify.result }}
          STATUS_COMMENT_ID: ${{ needs.status-comment.outputs.comment_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const result = process.env.VERIFICATION_RESULT;
            const passed = result === "success";
            const status = passed ? "PASS" : "FAIL";
            const icon = passed ? "✅" : "❌";
            const requested = process.env.REQUESTED_REVISION || "unavailable";
            const observed = process.env.OBSERVED_REVISION || "unavailable";
            const command = process.env.CANNICAL_COMMAND;
            const requestId = process.env.REQUEST_ID || "unavailable";
            const runId = process.env.RUN_ID;
            const runUrl = process.env.RUN_URL;
            const code = (value) => "`" + value + "`";
            const fields = String(context.payload.comment?.body || "").trim().split(/\s+/);
            const operation = fields[1] || "";
            const target = operation === "ci" ? "" : (fields[2] || "");
            const requestCommentId = Number(context.payload.comment?.id || 0);
            const laneMarker = `<!-- searchkernel-verification:${operation}:${target} -->`;
            const requestMarker = `<!-- searchkernel-verification-request:${requestCommentId} -->`;

            const headline = command ? code(command) : "verification";
            const body = [
              laneMarker,
              requestMarker,
              `### ${icon} ${headline} — ${status}`,
              "",
              `- Requested SHA: ${code(requested)}`,
              `- Observed SHA: ${code(observed)}`,
              `- Exact-head request: ${code(requestId)}`,
              `- Run: [View Actions run](${runUrl}) (run ${runId})`,
            ].join("\n");

            const statusCommentId = Number(process.env.STATUS_COMMENT_ID || 0);
            if (!statusCommentId) {
              core.warning("verification status comment id is unavailable; not creating a fallback spam comment");
              return;
            }

            const { data: current } = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: statusCommentId,
            });

            // A newer request for this lane may have already reused the sticky
            // comment. Never let an older completion overwrite that newer state.
            if (!String(current.body || "").includes(requestMarker)) {
              core.notice(
                `not updating stale verification request ${requestCommentId}; the lane now belongs to a newer request`
              );
              return;
            }

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: statusCommentId,
              body,
            });
