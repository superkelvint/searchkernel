name: Persistence compatibility

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "api/**"
      - "core/crates/searchkernel/src/index/**"
      - "core/crates/searchkernel/src/tests.rs"
      - "core/crates/searchkernel/src/schema.rs"
      - "core/crates/searchkernel/src/portable_definition.rs"
      - "core/crates/searchkernel/src/search.rs"
      - "core/crates/searchkernel/src/filter.rs"
      - "core/crates/searchkernel/src/result.rs"
      - "core/crates/searchkernel/tests/persistence_compatibility.rs"
      - "core/crates/searchkernel-ir/src/api_to_ir/schema.rs"
      - "core/crates/searchkernel-ir/src/ir_to_api/schema.rs"
      - "core/crates/searchkernel-ir/src/model/schema.rs"
      - "core/crates/searchkernel-ir/src/snapshot.rs"
      - "core/crates/searchkernel-ir-adapter/**"
      - "core/crates/searchkernel-vespa-engine/**"
      - "core/crates/searchkernel-vespa-bindings/**"
      - "core/native/vespa/**"
      - "reference/persistence/**"
      - "reference/vespa/m5/fixtures/persisted-v1/**"
      - "tools/check-persistence-fixtures.sh"
      - "tools/check-persistence-fixture-immutability.sh"
      - "tools/check-persistence-sensitivity.sh"
      - "tools/check-release-persistence-contract.py"
      - "docs/persistence-compatibility.md"
      - ".github/workflows/persistence-compatibility.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Immutable persistence corpus
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Allocate job-private checkout path
        id: checkout
        shell: bash
        run: |
          set -euo pipefail
          relative=".ci-checkouts/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-persistence"
          absolute="$GITHUB_WORKSPACE/$relative"
          if [[ -e "$absolute" ]]; then
            echo "::error::job-private persistence checkout already exists: $absolute"
            exit 1
          fi
          echo "relative=$relative" >> "$GITHUB_OUTPUT"
          echo "absolute=$absolute" >> "$GITHUB_OUTPUT"

      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: ${{ steps.checkout.outputs.relative }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select runner Python
        working-directory: ${{ steps.checkout.outputs.absolute }}
        run: bash .github/ci/select-python.sh

      - name: Verify exact pull-request head
        if: github.event_name == 'pull_request'
        working-directory: ${{ steps.checkout.outputs.absolute }}
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ "${actual,,}" != "${EXPECTED_HEAD,,}" ]]; then
            echo "::error::expected exact PR head $EXPECTED_HEAD, checked out $actual"
            exit 1
          fi

      - name: Verify frozen fixture structure and provenance
        working-directory: ${{ steps.checkout.outputs.absolute }}
        run: bash tools/check-persistence-fixtures.sh

      - name: Enforce append-only historical fixtures
        working-directory: ${{ steps.checkout.outputs.absolute }}
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash tools/check-persistence-fixture-immutability.sh "$BASE_REF"

      - name: Verify release persistence contract
        working-directory: ${{ steps.checkout.outputs.absolute }}
        run: python3 tools/check-release-persistence-contract.py

      - name: Execute historical reopen and mutation matrix
        working-directory: ${{ steps.checkout.outputs.absolute }}
        run: cargo test -p searchkernel --test persistence_compatibility --features native -- --nocapture

      - name: Execute persistence fault matrix
        working-directory: ${{ steps.checkout.outputs.absolute }}
        run: cargo test -p searchkernel --features native --lib persistence_fault_matrix_ -- --nocapture

      - name: Prove persistence gate sensitivity
        working-directory: ${{ steps.checkout.outputs.absolute }}
        run: bash tools/check-persistence-sensitivity.sh

      - name: Remove job-private checkout
        if: always() && steps.checkout.outputs.absolute != ''
        env:
          CHECKOUT_DIR: ${{ steps.checkout.outputs.absolute }}
        shell: bash
        run: |
          set -euo pipefail
          case "$CHECKOUT_DIR" in
            "$GITHUB_WORKSPACE"/.ci-checkouts/*) ;;
            *)
              echo "::error::refusing to clean unexpected checkout path: $CHECKOUT_DIR"
              exit 1
              ;;
          esac
          rm -rf -- "$CHECKOUT_DIR"
