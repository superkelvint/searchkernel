name: Persistence compatibility

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "api/**"
      - "core/crates/searchkernel/src/index/**"
      - "core/crates/searchkernel/src/tests.rs"
      - "core/crates/searchkernel/src/schema.rs"
      - "core/crates/searchkernel/src/portable_definition.rs"
      - "core/crates/searchkernel/src/search.rs"
      - "core/crates/searchkernel/src/filter.rs"
      - "core/crates/searchkernel/src/result.rs"
      - "core/crates/searchkernel/tests/persistence_compatibility.rs"
      - "core/crates/searchkernel-ir/src/api_to_ir/schema.rs"
      - "core/crates/searchkernel-ir/src/ir_to_api/schema.rs"
      - "core/crates/searchkernel-ir/src/model/schema.rs"
      - "core/crates/searchkernel-ir/src/snapshot.rs"
      - "core/crates/searchkernel-ir-adapter/**"
      - "core/crates/searchkernel-vespa-engine/**"
      - "core/crates/searchkernel-vespa-bindings/**"
      - "core/native/vespa/**"
      - "reference/persistence/**"
      - "reference/vespa/m5/fixtures/persisted-v1/**"
      - "tools/check-persistence-fixtures.sh"
      - "tools/check-persistence-fixture-immutability.sh"
      - "tools/check-persistence-sensitivity.sh"
      - ".github/workflows/persistence-compatibility.yml"
      - ".github/workflows/native-alma.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Immutable persistence corpus
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Select runner Python
        run: bash .github/ci/select-python.sh

      - name: Verify exact pull-request head
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ "${actual,,}" != "${EXPECTED_HEAD,,}" ]]; then
            echo "::error::expected exact PR head $EXPECTED_HEAD, checked out $actual"
            exit 1
          fi

      - name: Verify frozen fixture structure and provenance
        run: bash tools/check-persistence-fixtures.sh

      - name: Enforce append-only historical fixtures
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash tools/check-persistence-fixture-immutability.sh "$BASE_REF"

      - name: Native verification
        run: echo "::notice::Real-Vespa persistence verification runs in the AlmaLinux native job below."

  native:
    name: Real-Vespa persistence
    needs: fixtures
    uses: ./.github/workflows/native-alma.yml
    with:
      expected_head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      suite: persistence
