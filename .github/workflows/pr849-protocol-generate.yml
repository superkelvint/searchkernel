name: PR 849 protocol generation
on:
  push:
    branches: [codex/issue-846]
permissions:
  contents: read
jobs:
  generate:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate and emit changed artifacts
        shell: bash
        env:
          CI_IMAGE: docker.io/superkelvint/searchkernel-ci:latest
        run: |
          set -euo pipefail
          docker pull "$CI_IMAGE"
          docker run --rm --pids-limit=-1 \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e FLATBUFFERS_CPP_ROOT=/usr/local -e FLATC_PATH=/usr/local/bin/flatc \
            -e CC=/opt/rh/gcc-toolset-15/root/usr/bin/gcc \
            -e CXX=/opt/rh/gcc-toolset-15/root/usr/bin/g++ \
            "$CI_IMAGE" /bin/bash -lc '
              set -euo pipefail
              bash tools/generate-searchkernel-protocol.sh
              bash tools/generate-flatbuffers-bfbs.sh
              bash tools/generate-python-flatbuffers.sh
              bash tools/generate-typescript-flatbuffers.sh
            '
          python3 - <<'PY'
          import base64, pathlib, subprocess
          prefixes=("core/crates/searchkernel-protocol/src/generated/","core/crates/searchkernel-protocol/bfbs/","clients/python/searchkernel/_wire_generated/","clients/typescript/src/protocol/")
          raw=subprocess.check_output(["git","status","--porcelain=v1","-z"]).split(b"\0")
          for item in raw:
              if not item: continue
              path=item[3:].decode()
              if not path.startswith(prefixes): continue
              data=pathlib.Path(path).read_bytes()
              print("SKGEN_BEGIN "+base64.b64encode(path.encode()).decode())
              enc=base64.b64encode(data).decode()
              for i in range(0,len(enc),60000): print(enc[i:i+60000])
              print("SKGEN_END")
          PY
