name: PR 849 protocol generation
on:
  push:
    branches: [codex/issue-846]
permissions:
  contents: read
jobs:
  generate:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate and emit affected artifacts
        shell: bash
        env:
          CI_IMAGE: docker.io/superkelvint/searchkernel-ci:latest
        run: |
          set -euo pipefail
          docker pull "$CI_IMAGE"
          docker run --rm --pids-limit=-1 \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e FLATBUFFERS_CPP_ROOT=/usr/local -e FLATC_PATH=/usr/local/bin/flatc \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -e CC=/opt/rh/gcc-toolset-15/root/usr/bin/gcc \
            -e CXX=/opt/rh/gcc-toolset-15/root/usr/bin/g++ \
            "$CI_IMAGE" /bin/bash -lc '
              set -euo pipefail
              bash tools/generate-searchkernel-protocol.sh
              bash tools/generate-flatbuffers-bfbs.sh
              bash tools/generate-python-flatbuffers.sh
              chown -R "$HOST_UID:$HOST_GID" \
                core/crates/searchkernel-protocol/src/generated \
                core/crates/searchkernel-protocol/bfbs \
                clients/python/searchkernel/_wire_generated
            '
          python3 - <<'PY'
          import base64, pathlib
          candidates = [
              "core/crates/searchkernel-protocol/bfbs/searchkernel_request.bfbs",
              "core/crates/searchkernel-protocol/bfbs/searchkernel_response.bfbs",
              "core/crates/searchkernel-protocol/src/generated/mod.rs",
              "core/crates/searchkernel-protocol/src/generated/search_kernel/v2/delete_index_request_generated.rs",
              "core/crates/searchkernel-protocol/src/generated/search_kernel/v2/delete_index_result_generated.rs",
              "core/crates/searchkernel-protocol/src/generated/search_kernel/protocol/v2/request_payload_generated.rs",
              "core/crates/searchkernel-protocol/src/generated/search_kernel/protocol/v2/request_envelope_generated.rs",
              "core/crates/searchkernel-protocol/src/generated/search_kernel/protocol/v2/response_payload_generated.rs",
              "core/crates/searchkernel-protocol/src/generated/search_kernel/protocol/v2/response_envelope_generated.rs",
              "clients/python/searchkernel/_wire_generated/SearchKernel/V2/DeleteIndexRequest.py",
              "clients/python/searchkernel/_wire_generated/SearchKernel/V2/DeleteIndexRequest.pyi",
              "clients/python/searchkernel/_wire_generated/SearchKernel/V2/DeleteIndexResult.py",
              "clients/python/searchkernel/_wire_generated/SearchKernel/V2/DeleteIndexResult.pyi",
              "clients/python/searchkernel/_wire_generated/SearchKernel/Protocol/V2/RequestPayload.py",
              "clients/python/searchkernel/_wire_generated/SearchKernel/Protocol/V2/RequestPayload.pyi",
              "clients/python/searchkernel/_wire_generated/SearchKernel/Protocol/V2/RequestEnvelope.py",
              "clients/python/searchkernel/_wire_generated/SearchKernel/Protocol/V2/RequestEnvelope.pyi",
              "clients/python/searchkernel/_wire_generated/SearchKernel/Protocol/V2/ResponsePayload.py",
              "clients/python/searchkernel/_wire_generated/SearchKernel/Protocol/V2/ResponsePayload.pyi",
              "clients/python/searchkernel/_wire_generated/SearchKernel/Protocol/V2/ResponseEnvelope.py",
              "clients/python/searchkernel/_wire_generated/SearchKernel/Protocol/V2/ResponseEnvelope.pyi",
          ]
          for path in candidates:
              data=pathlib.Path(path).read_bytes()
              print("SKGEN_BEGIN "+base64.b64encode(path.encode()).decode())
              enc=base64.b64encode(data).decode()
              for i in range(0,len(enc),60000):
                  print("SKGEN_DATA "+enc[i:i+60000])
              print("SKGEN_END")
          PY
