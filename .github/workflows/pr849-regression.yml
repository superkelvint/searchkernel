name: PR 849 regression

on:
  push:
    branches: [codex/issue-846]

permissions:
  contents: read

jobs:
  multi-index:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run multi-index daemon regression
        shell: bash
        run: ./dev test searchkerneld-multi-index
