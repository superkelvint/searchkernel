name: Publish native Vespa base

on:
  push:
    branches: [main]
    paths:
      - "core/native/vespa/manifest.json"
      - "core/native/vespa/build-sdk.sh"
      - "tools/resolve-native-sdk.sh"
      - "tools/install-native-base-artifact.sh"
      - "tools/package-native-base-artifact.sh"
      - "tools/publish-native-base.sh"
      - ".github/workflows/publish-native-base.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-native-base
  cancel-in-progress: false

jobs:
  publish:
    name: Publish next Vespa base generation
    runs-on: [self-hosted, linux, x64]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish and verify host + CI bases
        run: tools/publish-native-base.sh all
