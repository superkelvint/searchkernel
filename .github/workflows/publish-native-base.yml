name: Publish native Vespa base

on:
  push:
    branches: [main, codex/issue-226]
    paths:
      - "core/native/vespa/manifest.json"
      - "core/native/vespa/build-sdk.sh"
      - "tools/resolve-native-sdk.sh"
      - "tools/install-native-base-artifact.sh"
      - "tools/package-native-base-artifact.sh"
      - ".github/workflows/publish-native-base.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-native-base
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.build_environment }} Vespa base
    runs-on: [self-hosted, linux, x64]
    strategy:
      max-parallel: 1
      matrix:
        build_environment: [host, ci]
    env:
      SEARCHKERNEL_BUILD_ENV: ${{ matrix.build_environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Locate trusted provisioning checkout
        run: |
          set -euo pipefail

          if SK_NATIVE_DISABLE_PUBLISHED_BASE=1 ./dev native-sdk path >/dev/null 2>&1; then
            echo "A valid machine-global ${SEARCHKERNEL_BUILD_ENV} base is already installed."
            exit 0
          fi

          pinned=$(python3 - <<'PY'
          import json
          with open("core/native/vespa/manifest.json", encoding="utf-8") as stream:
              print(json.load(stream)["vespa_commit"])
          PY
          )
          marker_rel="searchcore/src/tests/proton/documentdb/CMakeFiles/searchcore_embedded_crud_spike_app.dir/link.txt"
          found=

          while IFS= read -r cache; do
            candidate=$(dirname "$cache")
            case "$candidate" in
              */upstream/vespa) ;;
              *) continue ;;
            esac
            [[ -f "$candidate/$marker_rel" ]] || continue
            top=$(git -C "$candidate" rev-parse --show-toplevel 2>/dev/null || true)
            [[ -n "$top" ]] || continue
            [[ "$(cd "$top" && pwd -P)" == "$(cd "$candidate" && pwd -P)" ]] || continue
            actual=$(git -C "$candidate" rev-parse HEAD)
            [[ "$actual" == "$pinned" ]] || continue
            git -C "$candidate" diff --quiet --ignore-submodules -- || continue
            git -C "$candidate" diff --cached --quiet --ignore-submodules -- || continue
            found=$(cd "$candidate" && pwd -P)
            break
          done < <(find "$HOME" -maxdepth 8 -type f -name CMakeCache.txt -path '*/upstream/vespa/CMakeCache.txt' -print 2>/dev/null)

          if [[ -z "$found" ]]; then
            echo "::error::No clean configured standalone Vespa checkout at pinned revision $pinned was found on the trusted publisher runner."
            exit 1
          fi

          echo "Using provenance-checked publisher checkout: $found"
          echo "VESPA_ROOT=$found" >> "$GITHUB_ENV"

      - name: Provision canonical local source
        run: |
          SK_NATIVE_DISABLE_PUBLISHED_BASE=1 ./dev native-sdk ensure

      - name: Package immutable base
        id: package
        run: |
          mapfile -t files < <(bash tools/package-native-base-artifact.sh "$RUNNER_TEMP/native-base-${SEARCHKERNEL_BUILD_ENV}")
          test "${#files[@]}" -ge 2
          echo "archive=${files[0]}" >> "$GITHUB_OUTPUT"
          echo "checksum=${files[1]}" >> "$GITHUB_OUTPUT"
          commit=$(python3 - <<'PY'
          import json
          with open("core/native/vespa/manifest.json", encoding="utf-8") as stream:
              print(json.load(stream)["vespa_commit"])
          PY
          )
          target=$(rustc -vV | sed -n 's/^host: //p')
          echo "tag=vespa-base-v2-${SEARCHKERNEL_BUILD_ENV}-${target}-${commit}" >> "$GITHUB_OUTPUT"

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "immutable Vespa base release already exists: $TAG"
            echo "refusing to overwrite an existing compatibility identity"
            exit 0
          fi
          gh release create "$TAG" "$ARCHIVE" "$CHECKSUM" \
            --title "SearchKernel immutable Vespa base $TAG" \
            --notes "Generated by the canonical pinned-Vespa publisher."