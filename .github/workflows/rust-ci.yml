name: Rust CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt + compile + native compile + clippy
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: source
          # ./dev snapshots the exact checkout into its canonical container.
          # Keep ancestors available so that the Git bundle includes parents.
          fetch-depth: 0
          persist-credentials: true

      - name: Generate protocol in canonical image
        shell: bash
        working-directory: source
        run: |
          docker pull docker.io/superkelvint/searchkernel-ci:latest
          docker run --rm -v "$PWD:/work" -w /work docker.io/superkelvint/searchkernel-ci:latest bash -lc './dev regen protocol'
          git diff --binary --full-index > "$RUNNER_TEMP/protocol.patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/crates/searchkernel-protocol clients/python/searchkernel clients/typescript/src/semantic.ts
          git commit -m 'chore(protocol): regenerate canonical discovery artifacts' || test -z "$(git diff --cached --name-only)"
          git push origin HEAD:agent/web-real-daemon-1022
      - uses: actions/upload-artifact@v7
        with:
          name: protocol-generation
          path: ${{ runner.temp }}/protocol.patch
