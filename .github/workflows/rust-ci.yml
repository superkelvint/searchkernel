name: Rust CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt + compile + clippy
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run minimal Rust gate
        shell: bash
        env:
          CI_IMAGE: docker.io/superkelvint/searchkernel-ci:latest
        run: |
          set -euo pipefail

          docker pull "$CI_IMAGE"

          target_volume="searchkernel-minimal-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker volume rm -f "$target_volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "$target_volume" >/dev/null

          docker run --rm --pids-limit=-1 \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$target_volume:/cargo-target" \
            -w /work \
            -e CARGO_TARGET_DIR=/cargo-target \
            -e FLATBUFFERS_CPP_ROOT=/usr/local \
            -e FLATC_PATH=/usr/local/bin/flatc \
            -e CC=/opt/rh/gcc-toolset-15/root/usr/bin/gcc \
            -e CXX=/opt/rh/gcc-toolset-15/root/usr/bin/g++ \
            -e AR=/opt/rh/gcc-toolset-15/root/usr/bin/ar \
            -e RANLIB=/opt/rh/gcc-toolset-15/root/usr/bin/ranlib \
            -e LIBRARY_PATH=/opt/rh/gcc-toolset-15/root/usr/lib64:/opt/rh/gcc-toolset-15/root/usr/lib \
            "$CI_IMAGE" /bin/bash -lc '
              set -euo pipefail

              echo "== cargo fmt =="
              cargo fmt --all -- --check

              echo "== cargo check =="
              cargo check --workspace --all-targets --no-default-features --locked

              echo "== cargo clippy =="
              cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
            '


  verify_810_ruby_fixed2:
    name: PR 810 repaired exact-head Ruby parity
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Run exact-head Ruby client lane
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          SEARCHKERNEL_CI_PULL=never ./dev test ruby

  generate_810_reports_fixed2:
    name: PR 810 regenerate and verify client reports
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/810-fixed2
          persist-credentials: true
      - name: Regenerate reports and verify contracts
        shell: bash
        env:
          CI_IMAGE: docker.io/superkelvint/searchkernel-ci:latest
        run: |
          set -euo pipefail
          docker pull "$CI_IMAGE"
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            "$CI_IMAGE" /bin/bash -lc '
              set -euo pipefail
              PYTHON=$(bash tools/resolve-python.sh)
              "$PYTHON" tools/check-client-contracts.py --write
              export SEARCHKERNEL_DEV_USE_CI_IMAGE=0
              ./dev verify contracts
            '
          git diff --check
          git config user.name "searchkernel-verifier"
          git config user.email "searchkernel-verifier@users.noreply.github.com"
          git add docs/client-capabilities.json docs/CLIENT_CAPABILITIES.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(clients): regenerate capability evidence"
            git push origin HEAD:verify/810-fixed2
          fi
