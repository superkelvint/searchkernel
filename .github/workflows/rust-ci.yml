name: Rust CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt + compile + clippy
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: issue845
          persist-credentials: true

      - name: Regenerate issue 845 protocol artifacts
        shell: bash
        env:
          CI_IMAGE: docker.io/superkelvint/searchkernel-ci:latest
        run: |
          set -euo pipefail
          docker pull "$CI_IMAGE"
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE/issue845:/work" \
            -w /work \
            "$CI_IMAGE" /bin/bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /work
              ./dev regen protocol
              bash tools/generate-python-flatbuffers.sh
              flatc_bin=$(bash tools/resolve-flatbuffers.sh flatc)
              "$flatc_bin" --binary --schema -I api \
                -o core/crates/searchkernel-protocol/bfbs api/searchkernel_request.fbs
              "$flatc_bin" --binary --schema -I api \
                -o core/crates/searchkernel-protocol/bfbs api/searchkernel_response.fbs
              ./dev check-protocol
              chown -R "$HOST_UID:$HOST_GID" /work
            '

      - name: Commit regenerated issue 845 artifacts
        shell: bash
        working-directory: issue845
        run: |
          set -euo pipefail
          git add -f -- \
            core/crates/searchkernel-protocol/src/generated \
            core/crates/searchkernel-protocol/bfbs \
            clients/python/searchkernel/_wire_generated
          if git diff --cached --quiet; then
            echo "generated protocol artifacts already current"
          else
            git config user.name "searchkernel-protocol-bot"
            git config user.email "searchkernel-protocol-bot@users.noreply.github.com"
            git commit -m "build(protocol): regenerate targeted request bindings"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Run minimal Rust gate
        shell: bash
        env:
          CI_IMAGE: docker.io/superkelvint/searchkernel-ci:latest
        run: |
          set -euo pipefail

          docker pull "$CI_IMAGE"

          target_volume="searchkernel-minimal-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker volume rm -f "$target_volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "$target_volume" >/dev/null

          docker run --rm --pids-limit=-1 \
            -v "$GITHUB_WORKSPACE/issue845:/work:ro" \
            -v "$target_volume:/cargo-target" \
            -w /work \
            -e CARGO_TARGET_DIR=/cargo-target \
            -e FLATBUFFERS_CPP_ROOT=/usr/local \
            -e FLATC_PATH=/usr/local/bin/flatc \
            -e CC=/opt/rh/gcc-toolset-15/root/usr/bin/gcc \
            -e CXX=/opt/rh/gcc-toolset-15/root/usr/bin/g++ \
            -e AR=/opt/rh/gcc-toolset-15/root/usr/bin/ar \
            -e RANLIB=/opt/rh/gcc-toolset-15/root/usr/bin/ranlib \
            -e LIBRARY_PATH=/opt/rh/gcc-toolset-15/root/usr/lib64:/opt/rh/gcc-toolset-15/root/usr/lib \
            "$CI_IMAGE" /bin/bash -lc '
              set -euo pipefail

              echo "== cargo fmt =="
              cargo fmt --all -- --check

              echo "== cargo check =="
              cargo check --workspace --all-targets --no-default-features --locked

              echo "== cargo clippy =="
              cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
            '
