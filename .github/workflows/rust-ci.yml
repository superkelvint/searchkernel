name: Rust CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt + compile + native compile + clippy
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: source
          # ./dev snapshots the exact checkout into its canonical container.
          # Keep ancestors available so that the Git bundle includes parents.
          fetch-depth: 0
          persist-credentials: false

      - name: Run authoritative PR gate
        shell: bash
        working-directory: source
        run: ./dev ci
