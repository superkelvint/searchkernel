name: Rust CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt + compile + native compile + clippy
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: source
          # ./dev snapshots the exact checkout into its canonical container.
          # Keep ancestors available so that the Git bundle includes parents.
          fetch-depth: 0
          persist-credentials: false

      - name: Generate protocol in canonical image
        shell: bash
        working-directory: source
        run: |
          docker pull docker.io/superkelvint/searchkernel-ci:latest
          docker run --rm -v "$PWD:/work" -w /work docker.io/superkelvint/searchkernel-ci:latest bash -lc './dev regen protocol'
          git diff --binary --full-index > "$RUNNER_TEMP/protocol.patch"
      - uses: actions/upload-artifact@v7
        with:
          name: protocol-generation
          path: ${{ runner.temp }}/protocol.patch
