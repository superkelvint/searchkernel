name: Trusted PR verification authority

# This controller is deliberately loaded from the default branch by workflow_run.
# Candidate code never receives the credential that publishes the merge-authorizing
# check. The external check is created by a dedicated GitHub App and attached to
# the immutable PR head SHA.
on:
  workflow_run:
    workflows: ["CI invariant verification"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  authorize:
    name: Trusted authorization
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.refs.outputs.pr }}
      head: ${{ steps.refs.outputs.head }}
      base: ${{ steps.refs.outputs.base }}
      authority_changed: ${{ steps.authority.outputs.authority_changed }}
      transition_only: ${{ steps.authority.outputs.transition_only }}
      rust: ${{ steps.plan.outputs.rust }}
      python: ${{ steps.plan.outputs.python }}
      typescript: ${{ steps.plan.outputs.typescript }}
      ruby: ${{ steps.plan.outputs.ruby }}
      native: ${{ steps.plan.outputs.native }}
      coverage: ${{ steps.plan.outputs.coverage }}
    steps:
      - name: Check out trusted default-branch authority
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve immutable PR refs
        id: refs
        env:
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          BASE: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
        run: |
          set -euo pipefail
          [[ -n "$PR" && -n "$HEAD" && -n "$BASE" ]] || { echo '::error::workflow_run has no PR identity'; exit 1; }
          git fetch --no-tags --filter=blob:none origin "+$HEAD:refs/searchkernel/trusted-head" "+$BASE:refs/searchkernel/trusted-base"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          git diff --name-only --no-renames "$BASE" "$HEAD" > "$RUNNER_TEMP/changed.txt"
      - name: Classify candidate verification authority
        id: authority
        env:
          HEAD: ${{ steps.refs.outputs.head }}
          BASE: ${{ steps.refs.outputs.base }}
        run: |
          set -euo pipefail
          python3 .github/ci/trusted_pr_authority.py \
            --changed-paths "$RUNNER_TEMP/changed.txt" \
            --base "$BASE" \
            --head "$HEAD" \
            --github-output "$GITHUB_OUTPUT"
      - name: Plan from trusted base selectors
        id: plan
        env:
          BASE: ${{ steps.refs.outputs.base }}
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          for helper in behavioral_lanes_required.py native_verifier_required.py coverage_verifier_required.py; do
            git show "$BASE:.github/ci/$helper" > "$d/$helper"
          done
          python3 "$d/behavioral_lanes_required.py" --github-output "$GITHUB_OUTPUT" < "$RUNNER_TEMP/changed.txt"
          native=$(python3 "$d/native_verifier_required.py" < "$RUNNER_TEMP/changed.txt")
          coverage=$(python3 "$d/coverage_verifier_required.py" < "$RUNNER_TEMP/changed.txt")
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"

  rust:
    needs: authorize
    if: needs.authorize.outputs.authority_changed == 'false' && needs.authorize.outputs.rust == 'true'
    uses: ./.github/workflows/ci-image-runner.yml
    with: { revision: "${{ needs.authorize.outputs.head }}", target: rust-non-native }
  python:
    needs: authorize
    if: needs.authorize.outputs.authority_changed == 'false' && needs.authorize.outputs.python == 'true'
    uses: ./.github/workflows/ci-image-runner.yml
    with: { revision: "${{ needs.authorize.outputs.head }}", target: python }
  typescript:
    needs: authorize
    if: needs.authorize.outputs.authority_changed == 'false' && needs.authorize.outputs.typescript == 'true'
    uses: ./.github/workflows/ci-image-runner.yml
    with: { revision: "${{ needs.authorize.outputs.head }}", target: typescript }
  ruby:
    needs: authorize
    if: needs.authorize.outputs.authority_changed == 'false' && needs.authorize.outputs.ruby == 'true'
    uses: ./.github/workflows/ci-image-runner.yml
    with: { revision: "${{ needs.authorize.outputs.head }}", target: ruby }
  native:
    needs: authorize
    if: needs.authorize.outputs.authority_changed == 'false' && needs.authorize.outputs.native == 'true'
    uses: ./.github/workflows/ci-image-runner.yml
    with: { revision: "${{ needs.authorize.outputs.head }}", target: native-full }
  coverage:
    needs: authorize
    if: needs.authorize.outputs.authority_changed == 'false' && needs.authorize.outputs.coverage == 'true'
    uses: ./.github/workflows/ci-image-runner.yml
    with: { revision: "${{ needs.authorize.outputs.head }}", target: nightly-coverage }

  publish-gate:
    name: Publish trusted candidate-head gate
    if: ${{ always() && !cancelled() && needs.authorize.outputs.head != '' }}
    needs: [authorize, rust, python, typescript, ruby, native, coverage]
    runs-on: ubuntu-latest
    environment: trusted-ci-authority
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Mint dedicated trusted-CI App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.TRUSTED_CI_APP_ID }}
          private-key: ${{ secrets.TRUSTED_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Revalidate current PR and publish candidate-head check
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_CI_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          TRUSTED_CI_APP_ID: ${{ vars.TRUSTED_CI_APP_ID }}
          PR: ${{ needs.authorize.outputs.pr }}
          HEAD: ${{ needs.authorize.outputs.head }}
          BASE: ${{ needs.authorize.outputs.base }}
          AUTH: ${{ needs.authorize.result }}
          AUTHORITY_CHANGED: ${{ needs.authorize.outputs.authority_changed }}
          TRANSITION_ONLY: ${{ needs.authorize.outputs.transition_only }}
          RUST_REQ: ${{ needs.authorize.outputs.rust }}
          RUST: ${{ needs.rust.result }}
          PY_REQ: ${{ needs.authorize.outputs.python }}
          PY: ${{ needs.python.result }}
          TS_REQ: ${{ needs.authorize.outputs.typescript }}
          TS: ${{ needs.typescript.result }}
          RUBY_REQ: ${{ needs.authorize.outputs.ruby }}
          RUBY: ${{ needs.ruby.result }}
          NATIVE_REQ: ${{ needs.authorize.outputs.native }}
          NATIVE: ${{ needs.native.result }}
          COVERAGE_REQ: ${{ needs.authorize.outputs.coverage }}
          COVERAGE: ${{ needs.coverage.result }}
        run: |
          set -euo pipefail
          conclusion=success
          summary="Trusted base-owned verification passed for exact candidate head $HEAD."

          response=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR")
          read -r current_head current_base state < <(
            python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("head",{}).get("sha",""), d.get("base",{}).get("sha",""), d.get("state",""))' <<<"$response"
          )

          fail() {
            conclusion=failure
            summary=$1
          }
          check_lane() {
            local label=$1 required=$2 result=$3
            if [[ "$required" == true && "$result" != success ]]; then
              fail "$label trusted lane ended as $result for $HEAD."
            fi
          }

          if [[ "$state" != open || "${current_head,,}" != "${HEAD,,}" || "${current_base,,}" != "${BASE,,}" ]]; then
            fail "Stale trusted evidence: PR #$PR is now state=$state head=$current_head base=$current_base; this run verified head=$HEAD base=$BASE."
          elif [[ "$AUTHORITY_CHANGED" == true ]]; then
            if [[ "$TRANSITION_ONLY" == true ]]; then
              fail "Candidate changes verification authority. Normal CI cannot self-authorize it; use the trusted CI authority transition workflow for this exact authority-only head."
            else
              fail "Candidate mixes verification-authority and product changes. Split them; trusted transitions are intentionally authority-only."
            fi
          elif [[ "$AUTH" != success ]]; then
            fail "Trusted authorization job ended as $AUTH for $HEAD."
          else
            check_lane Rust "$RUST_REQ" "$RUST"
            check_lane Python "$PY_REQ" "$PY"
            check_lane TypeScript "$TS_REQ" "$TS"
            check_lane Ruby "$RUBY_REQ" "$RUBY"
            check_lane Native "$NATIVE_REQ" "$NATIVE"
            check_lane Coverage "$COVERAGE_REQ" "$COVERAGE"
          fi

          python3 .github/ci/trusted_check.py \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$HEAD" \
            --name "Trusted invariant gate" \
            --external-id "trusted-pr:$PR:$HEAD" \
            --app-id "$TRUSTED_CI_APP_ID" \
            --conclusion "$conclusion" \
            --summary "$summary" \
            --details-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          [[ "$conclusion" == success ]]
