name: Rust unit tests

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain*"
      - "api/**"
      - "core/**"
      - "searchkerneld/**"
      - "reference/api-conformance/**"
      - ".github/workflows/unit-tests.yml"
      - "dev"
      - "tools/copy-shared-library-into-sdk.sh"
      - "tools/test-native-sdk-packaging.sh"
      - "tools/native-build-fingerprint.py"
      - "tools/test-native-environment-fingerprint.sh"
      - "tools/resolve-native-sdk.sh"
      - "tools/test-native-sdk-cache.sh"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain*"
      - "api/**"
      - "core/**"
      - "searchkerneld/**"
      - "reference/api-conformance/**"
      - ".github/workflows/unit-tests.yml"
      - "dev"
      - "tools/copy-shared-library-into-sdk.sh"
      - "tools/test-native-sdk-packaging.sh"
      - "tools/native-build-fingerprint.py"
      - "tools/test-native-environment-fingerprint.sh"
      - "tools/resolve-native-sdk.sh"
      - "tools/test-native-sdk-cache.sh"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Workspace unit tests
    runs-on: [self-hosted, linux, x64]
    env:
      CARGO_TARGET_DIR: target/ci-non-native
      SEARCHKERNEL_BUILD_ENV: ci
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/ci-non-native"
          shared-key: non-native

      - name: Cache pinned FlatBuffers toolchain
        uses: actions/cache@v4
        with:
          path: .git/searchkernel/toolchains/flatbuffers/25.12.19
          key: flatbuffers-25.12.19-${{ runner.os }}-${{ runner.arch }}

      - name: Ensure pinned FlatBuffers toolchain
        run: ./dev install flatbuffers

      - name: Run native SDK packaging regression
        run: bash tools/test-native-sdk-packaging.sh

      - name: Run native environment fingerprint regression
        run: bash tools/test-native-environment-fingerprint.sh

      - name: Run native SDK cache regression
        run: bash tools/test-native-sdk-cache.sh

      - name: Run semantic verifier routing regression
        run: bash reference/vespa/verifiers/test-routing.sh

      - name: Run workspace unit tests
        run: cargo test --workspace --no-default-features

      - name: Run portable API conformance
        run: reference/api-conformance/verify.sh
