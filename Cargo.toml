[workspace]
members = [
    "core/crates/flatbuffers-build",
    "core/crates/searchkernel-protocol",
    "core/crates/searchkernel-ir",
    "core/crates/searchkernel-filter",
    "core/crates/searchkernel",
    "core/crates/searchkernel-vespa-bindings",
    "core/crates/searchkernel-vespa-engine",
    "core/crates/searchkernel-testkit",
    "core/crates/searchkernel-dispatch",
    "core/crates/searchkernel-ir-adapter",
    "searchkerneld",
]
resolver = "2"
exclude = [
    "reference/vespa/m4/rust-driver",
    "reference/vespa/m6/rust-driver",
    "reference/vespa/m7/rust-driver",
    "reference/vespa/m11/rust-driver",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"
description = "Thin Rust interface to Vespa's local search engine"
repository = "https://github.com/vespa/searchkernel2"
keywords = ["search", "vespa"]
categories = ["database-implementations"]
