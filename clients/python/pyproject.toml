[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "searchkernel"
version = "0.1.0"
description = "Python client for the Search Kernel embedded engine"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["searchkernel*"]

[tool.setuptools.package-data]
searchkernel = ["native/**/*"]
