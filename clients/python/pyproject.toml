[build-system]
requires = ["setuptools>=70.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "searchkernel"
version = "0.1.0"
description = "Search Kernel domain models and ergonomic builders"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "flatbuffers==25.12.19",
    "grpcio==1.84.0",
    "protobuf>=7.35.1,<8",
]

[project.optional-dependencies]
codegen = [
    "grpcio-tools==1.84.0",
    "protobuf==7.35.1",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["searchkernel*"]

[tool.setuptools.package-data]
searchkernel = [
    "_wire/v1/generated/**/*.py",
    "_wire/v1/generated/**/*.pyi",
    "bin/*",
    "lib/*",
    "lib/.searchkernel-runtime-provenance.json",
    "manifest.json",
]
