[package]
name = "searchkernel-ffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
ffi-test-support = []

[dependencies]
flatbuffers = "=25.12.19"
searchkernel-ir = { path = "../searchkernel-ir" }

[build-dependencies]
cbindgen = "0.29.4"

[dev-dependencies]
serde_json = "1"
searchkernel-json = { path = "../searchkernel-json" }
searchkernel-testkit = { path = "../searchkernel-testkit" }
