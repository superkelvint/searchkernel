[package]
name = "searchkernel-ffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
ffi-test-support = ["dep:searchkernel-testkit"]
production = [
    "dep:searchkernel",
    "searchkernel/native",
    "searchkernel/internal-api",
]
c7-test-support = ["ffi-test-support"]

[dependencies]
flatbuffers = "=25.12.19"
searchkernel-ir = { path = "../searchkernel-ir" }
searchkernel = { path = "../searchkernel", optional = true }
searchkernel-testkit = { path = "../searchkernel-testkit", optional = true }

[build-dependencies]
cbindgen = "0.29.4"

[dev-dependencies]
serde_json = "1"
searchkernel-json = { path = "../searchkernel-json" }
