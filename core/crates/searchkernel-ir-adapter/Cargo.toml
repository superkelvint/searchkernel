[package]
name = "searchkernel-ir-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["native"]
native = ["searchkernel-vespa-engine/native"]
hardening = ["native", "searchkernel-vespa-engine/hardening"]

[dependencies]
searchkernel-ir = { version = "=0.1.0", path = "../searchkernel-ir" }
searchkernel-vespa-engine = { version = "=0.1.0", path = "../searchkernel-vespa-engine", default-features = false }
serde_json = "1"

[dev-dependencies]
searchkernel-ir = { version = "=0.1.0", path = "../searchkernel-ir", features = ["test"] }
