[package]
name = "searchkernel-ir"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
autotests = false

[features]
test = []

[dependencies]
searchkernel-protocol = { version = "=0.1.0", path = "../searchkernel-protocol", default-features = false }
searchkernel-filter = { version = "=0.1.0", path = "../searchkernel-filter" }
flatbuffers = "=25.12.19"
serde_json = "1"

[dev-dependencies]
searchkernel-protocol = { version = "=0.1.0", path = "../searchkernel-protocol", features = ["json"] }
serde = { version = "1", features = ["derive"] }
