[package]
name = "searchkernel-protocol"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
build = "build.rs"

[features]
default = ["json"]
json = ["dep:cc"]

[dependencies]
flatbuffers = "=25.12.19"

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[[test]]
name = "standard_json"
required-features = ["json"]

[[test]]
name = "php_json_contract"
required-features = ["json"]

[[test]]
name = "ruby_json_contract"
required-features = ["json"]
