[package]
name = "searchkernel-protocol"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
build = "build.rs"

[dependencies]
flatbuffers = "=25.12.19"
# This dependency is intentionally normal (rather than only a build-dependency):
# Cargo exposes `links` metadata to build scripts through normal dependencies,
# which lets build.rs consume the fork's exact native output directory without
# scanning unrelated target artifacts.
flatbuffers-build = { path = "../flatbuffers-build", version = "=0.2.4", features = ["vendored"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
serde_json = "1"
