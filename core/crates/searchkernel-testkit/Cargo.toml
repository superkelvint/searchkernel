[package]
name = "searchkernel-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
flatbuffers = "=25.12.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
searchkernel-ir = { version = "=0.1.0", path = "../searchkernel-ir" }
searchkernel-protocol = { version = "=0.1.0", path = "../searchkernel-protocol" }

[[bin]]
name = "searchkernel-conformance"
path = "src/bin/searchkernel-conformance.rs"

[[bin]]
name = "searchkernel-semantic-snapshot"
path = "src/bin/searchkernel-semantic-snapshot.rs"

[[bin]]
name = "searchkernel-result-fixtures"
path = "src/bin/searchkernel-result-fixtures.rs"

[[bin]]
name = "searchkernel-semantic-parity"
path = "src/bin/searchkernel-semantic-parity.rs"
