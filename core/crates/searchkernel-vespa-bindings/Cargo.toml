[package]
name = "searchkernel-vespa-bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
links = "searchkernel_vespa"
build = "build.rs"
include = ["Cargo.toml", "README.md", "build.rs", "consumer_bundle.rs", "consumer_runtime.rs", "consumer_layout.rs", "runtime.json", "src/**"]

[features]
default = ["native"]
native = ["dep:cc", "dep:flate2", "dep:fs2", "dep:serde_json", "dep:sha2", "dep:tar", "dep:ureq", "dep:url"]
hardening = ["native"]
native-contract-tests = ["native", "dep:cc"]

[lib]
name = "searchkernel_vespa_bindings"

[build-dependencies]
cc = { version = "1", optional = true }
flate2 = { version = "1", optional = true }
fs2 = { version = "0.4", optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
tar = { version = "0.4", optional = true }
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"], optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
cc = "1"
flate2 = "1"
fs2 = "0.4"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }
url = "2"
