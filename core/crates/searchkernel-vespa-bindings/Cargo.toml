[package]
name = "searchkernel-vespa-bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
links = "searchkernel_vespa"
build = "build.rs"

[features]
default = ["native"]
native = ["dep:cc"]
hardening = ["native"]
native-contract-tests = ["native", "dep:cc"]

[lib]
name = "searchkernel_vespa_bindings"

[build-dependencies]
cc = { version = "1", optional = true }
flate2 = "1"
fs2 = "0.4"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"

[dev-dependencies]
flate2 = "1"
fs2 = "0.4"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
