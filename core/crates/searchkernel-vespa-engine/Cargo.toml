[package]
name = "searchkernel-vespa-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
searchkernel-vespa-bindings = { path = "../searchkernel-vespa-bindings", default-features = false }
# Vespa uses the pinned JDK Character.getType(); the live Java oracle is the
# compatibility authority if this independently pinned table ever diverges.
unicode-general-category = "=1.1.0"
unicode-normalization = "0.1.25"
serde_json = "1"

[features]
default = ["native"]
native = ["searchkernel-vespa-bindings/native"]
native-contract-tests = ["native", "searchkernel-vespa-bindings/native-contract-tests"]
hardening = ["native", "searchkernel-vespa-bindings/hardening"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

