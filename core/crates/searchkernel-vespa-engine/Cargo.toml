[package]
name = "searchkernel-vespa-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
searchkernel-vespa-bindings = { path = "../searchkernel-vespa-bindings" }
# Vespa uses the pinned JDK Character.getType(); the live Java oracle is the
# compatibility authority if this independently pinned table ever diverges.
unicode-general-category = "=1.1.0"
unicode-normalization = "0.1.25"
serde_json = "1"

[features]
hardening = ["searchkernel-vespa-bindings/hardening"]
