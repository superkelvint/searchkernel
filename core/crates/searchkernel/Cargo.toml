[package]
name = "searchkernel"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = []
native = ["dep:libc", "searchkernel-ir-adapter/native"]
internal-api = []

[dependencies]
searchkernel-ir = { path = "../searchkernel-ir" }
searchkernel-ir-adapter = { path = "../searchkernel-ir-adapter", default-features = false, optional = true }
libc = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
searchkernel-ir = { path = "../searchkernel-ir", features = ["test"] }
searchkernel-protocol = { path = "../searchkernel-protocol" }
searchkernel-testkit = { path = "../searchkernel-testkit" }
