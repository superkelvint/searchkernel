[package]
name = "searchkernel"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = []
native = ["dep:libc", "dep:searchkernel-vespa-bindings", "searchkernel-ir-adapter/native"]
remote = [
    "dep:searchkernel-protocol",
    "dep:searchkernel-rpc",
    "dep:hyper-util",
    "dep:tokio",
    "dep:tonic",
    "dep:tower",
]
internal-api = []
m11-verifier-hardening = ["searchkernel-vespa-engine/hardening"]

[dependencies]
searchkernel-ir = { path = "../searchkernel-ir" }
searchkernel-protocol = { path = "../searchkernel-protocol", optional = true }
searchkernel-rpc = { path = "../searchkernel-rpc", optional = true }
searchkernel-ir-adapter = { path = "../searchkernel-ir-adapter", default-features = false, optional = true }
libc = { version = "0.2", optional = true }
searchkernel-vespa-bindings = { path = "../searchkernel-vespa-bindings", default-features = false, optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time"], optional = true }
tonic = { version = "0.12", features = ["transport"], optional = true }
tower = { version = "0.4", default-features = false, features = ["util"], optional = true }

[dev-dependencies]
flatbuffers = "=25.12.19"
searchkernel-dispatch = { path = "../searchkernel-dispatch" }
searchkernel-ir = { path = "../searchkernel-ir", features = ["test"] }
searchkernel-protocol = { path = "../searchkernel-protocol" }
searchkernel-testkit = { path = "../searchkernel-testkit" }
tokio-stream = { version = "0.1", features = ["net"] }

searchkernel-vespa-engine = { path = "../searchkernel-vespa-engine", default-features = false }

[[example]]
name = "searchkernel-i-driver"
path = "examples/searchkernel-i-driver.rs"
required-features = ["native"]

[[example]]
name = "searchkernel-m11-driver"
path = "examples/searchkernel-m11-driver.rs"
required-features = ["native", "internal-api", "m11-verifier-hardening"]

[[example]]
name = "searchkernel-m12-driver"
path = "examples/searchkernel-m12-driver.rs"
required-features = ["native"]

[[example]]
name = "searchkernel-m12-adapter-driver"
path = "examples/searchkernel-m12-adapter-driver.rs"
required-features = ["native"]

[[example]]
name = "searchkernel-m12-error"
path = "examples/searchkernel-m12-error.rs"
required-features = ["native"]

[[example]]
name = "searchkernel-m12-prepare-fixture"
path = "examples/searchkernel-m12-prepare-fixture.rs"
required-features = ["native"]

[[example]]
name = "searchkernel-m13-driver"
path = "examples/searchkernel-m13-driver.rs"
required-features = ["native"]

[[example]]
name = "searchkernel-m13-adapter-driver"
path = "examples/searchkernel-m13-adapter-driver.rs"
required-features = ["native"]

[[example]]
name = "searchkernel-m13-error"
path = "examples/searchkernel-m13-error.rs"
required-features = ["native"]

[[example]]
name = "searchkernel-m14-driver"
path = "examples/searchkernel-m14-driver.rs"
required-features = ["native"]

[[example]]
name = "searchkernel-m14-adapter-driver"
path = "examples/searchkernel-m14-adapter-driver.rs"
required-features = ["native"]

[[example]]
name = "searchkernel-m14-error"
path = "examples/searchkernel-m14-error.rs"
required-features = ["native"]

[[example]]
name = "searchkernel-recovery-driver"
path = "examples/searchkernel-recovery-driver.rs"
required-features = ["native"]
