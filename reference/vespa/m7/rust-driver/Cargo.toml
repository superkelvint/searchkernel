[package]
name = "searchkernel-m7-driver"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
searchkernel-vespa-engine = { path = "../../../../core/crates/searchkernel-vespa-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "searchkernel-m7-driver"
