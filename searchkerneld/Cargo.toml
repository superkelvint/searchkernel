[package]
name = "searchkerneld"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme = "../README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["native"]
native = ["searchkernel/native"]

[dependencies]
prost = "0.13"
searchkernel = { path = "../core/crates/searchkernel", default-features = false, features = ["internal-api"] }
searchkernel-dispatch = { path = "../core/crates/searchkernel-dispatch" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.12", features = ["transport"] }
tonic-web = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
flatbuffers = "=25.12.19"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
searchkernel = { path = "../core/crates/searchkernel", default-features = false, features = ["internal-api"] }
searchkernel-protocol = { path = "../core/crates/searchkernel-protocol" }
searchkernel-testkit = { path = "../core/crates/searchkernel-testkit" }
tower = "0.5"
