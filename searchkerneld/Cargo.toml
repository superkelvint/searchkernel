[package]
name = "searchkerneld"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme = "../README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["native"]
native = ["searchkernel/native"]
test-support = []

[dependencies]
flatbuffers = "=25.12.19"
base64 = "0.22"
bytes = "1"
http = "1"
http-body-util = "0.1"
prost = "0.13"
searchkernel = { path = "../core/crates/searchkernel", default-features = false, features = ["internal-api"] }
searchkernel-dispatch = { path = "../core/crates/searchkernel-dispatch" }
searchkernel-ir = { path = "../core/crates/searchkernel-ir" }
searchkernel-protocol = { path = "../core/crates/searchkernel-protocol" }
searchkernel-rpc = { path = "../core/crates/searchkernel-rpc" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.12", features = ["transport"] }
tonic-web = "0.12"
tower = { version = "0.4", default-features = false, features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
searchkernel = { path = "../core/crates/searchkernel", default-features = false, features = ["internal-api", "remote"] }
searchkernel-ir = { path = "../core/crates/searchkernel-ir" }
searchkernel-testkit = { path = "../core/crates/searchkernel-testkit" }

[[test]]
name = "process_shutdown"
path = "tests/process_shutdown.rs"
required-features = ["native"]
