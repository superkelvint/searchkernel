[package]
name = "searchkernel-bindgen"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
autobins = false

[[bin]]
name = "searchkernel-bindgen"
path = "src/driver.rs"

[dependencies]
flatbuffers = "=25.12.19"
flatbuffers-reflection = "=0.1.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
