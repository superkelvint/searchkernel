# ---------------------------------------------------------------------------
# Subsystems
#
# "paths" are ownership patterns, not execution-engine globs. The future DAG
# validator/selector owns their interpretation and must test it explicitly.
# ---------------------------------------------------------------------------

[[subsystem]]
id = "portable-schema"
paths = ["api/*.fbs", "api/**/*.fbs"]
requires = [
  "protocol-generated",
  "api-conformance",
  "clients-full",
  "rust-non-native",
  "persistence-native",
]

[[subsystem]]
id = "rpc-transport-contract"
paths = ["api/rpc/**", "tools/rpc-codegen/**"]
requires = ["protocol-generated", "python-client", "typescript-client", "client-contracts"]

[[subsystem]]
id = "searchkernel-filter"
paths = ["core/crates/searchkernel-filter/**"]
requires = ["rust-non-native", "rust-quality"]

[[subsystem]]
id = "searchkernel-ir"
paths = ["core/crates/searchkernel-ir/**"]
requires = ["rust-non-native", "rust-quality"]

[[subsystem]]
id = "searchkernel-protocol"
paths = ["core/crates/searchkernel-protocol/**"]
requires = ["rust-non-native", "protocol-generated", "api-conformance"]

[[subsystem]]
id = "searchkernel-testkit"
paths = ["core/crates/searchkernel-testkit/**"]
requires = ["rust-non-native", "rust-quality"]

[[subsystem]]
id = "searchkernel-dispatch"
paths = ["core/crates/searchkernel-dispatch/**"]
requires = ["rust-non-native", "rust-quality", "api-conformance"]

[[subsystem]]
id = "searchkernel-ir-adapter"
paths = ["core/crates/searchkernel-ir-adapter/**"]
requires = ["rust-non-native", "native-full"]

[[subsystem]]
id = "searchkernel-vespa-bindings"
paths = ["core/crates/searchkernel-vespa-bindings/**"]
requires = ["rust-non-native", "abi", "native-full"]

[[subsystem]]
id = "searchkernel-vespa-engine"
paths = ["core/crates/searchkernel-vespa-engine/**"]
requires = ["rust-non-native", "native-full"]

[[subsystem]]
id = "searchkernel-rust-api"
paths = ["core/crates/searchkernel/**"]
requires = ["rust-non-native", "rust-quality", "client-contracts"]

[[subsystem]]
id = "native-vespa-cpp"
paths = ["core/native/**"]
requires = ["abi", "native-full"]

[[subsystem]]
id = "searchkerneld"
paths = ["searchkerneld/**"]
requires = ["rust-non-native", "rust-quality", "product.python-native-e2e", "web-static-serving-e2e"]

[[subsystem]]
id = "client-python"
paths = ["clients/python/**"]
requires = ["python-client", "client-contracts"]

[[subsystem]]
id = "client-typescript"
paths = ["clients/typescript/**"]
requires = ["typescript-client", "client-contracts", "web-portable-client"]

[[subsystem]]
id = "client-php"
paths = ["clients/php/**"]
requires = ["php-client", "client-contracts"]

[[subsystem]]
id = "persistence"
paths = [
  "reference/persistence/**",
  "reference/vespa/m5/fixtures/persisted-v1/**",
  "core/crates/searchkernel/tests/persistence_compatibility.rs",
  "core/crates/searchkernel-ir/src/snapshot.rs",
]
requires = ["persistence-native", "vespa.recovery"]

[[subsystem]]
id = "vespa-verifiers"
paths = ["reference/vespa/**"]
requires = ["native-full"]

[[subsystem]]
id = "verification-control-plane"
paths = [".github/ci/**", ".github/workflows/**", ".githooks/**", "dev", "verification/**", "tools/check-verification-dag.py", "tools/test_check_verification_dag.py"]
requires = ["verification-policy", "full"]

