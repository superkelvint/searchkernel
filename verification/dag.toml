# ---------------------------------------------------------------------------
# Subsystems
#
# "paths" are ownership patterns, not execution-engine globs. The future DAG
# validator/selector owns their interpretation and must test it explicitly.
# ---------------------------------------------------------------------------

[[subsystem]]
id = "portable-schema"
paths = [
  "api/searchkernel.fbs",
  "api/searchkernel_request.fbs",
  "api/searchkernel_response.fbs",
]
requires = [
  "protocol-generated",
  "api-conformance",
  "clients-full",
  "rust-non-native",
  "persistence-native",
]

[[subsystem]]
id = "rpc-transport-contract"
paths = ["api/rpc/searchkernel.proto", "tools/rpc-codegen/**"]
requires = ["rust-non-native", "protocol-generated", "python-client", "typescript-client", "php-client", "client-contracts"]

[[subsystem]]
id = "flatbuffers-build"
paths = ["core/crates/flatbuffers-build/**"]
requires = ["rust-non-native", "rust-quality", "protocol-generated"]

[[subsystem]]
