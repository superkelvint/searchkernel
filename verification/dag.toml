# SearchKernel verification DAG.
#
# This file is the semantic source of truth for verification ownership.
# Execution systems may project this graph, but must not redefine it.
# Historical selector IDs are aliases only; semantic task IDs describe what
# verification proves.

schema_version = 1
unknown_behavior = "block"
runner_classes = ["linux", "self-hosted-native", "mixed"]
full_roots = ["full"]

# depends_on means an execution prerequisite.
# subsumes means this command already executes/proves the referenced task
# closure, so an executor must not schedule that task redundantly.

# ---------------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------------

