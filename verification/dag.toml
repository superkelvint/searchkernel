# SearchKernel verification DAG.
#
# This file is the semantic source of truth for verification ownership.
# It is intentionally independent of GitHub Actions, moonrepo, nextest, or any
# other execution engine.
#
# Rules:
# - new behavioral subsystems MUST be added here before they can be
#   merge-authorized;
# - unknown behavioral paths fail closed;
# - execution tools may project this DAG, but may not redefine its semantics;
# - aggregate tasks have no command and exist only to express closure.
#
# First-pass schema. Consumers must reject unknown schema_version values.

schema_version = 1
unknown_behavior = "block"
full_roots = ["full"]
legacy_lane_names = [
  "rust", "python", "typescript", "php", "ruby", "native", "protocol",
  "api_conformance", "contracts", "abi", "persistence",
  "issue_queue", "verification",
]

[coverage]
include = [
  "api/**",
  "core/crates/**",
  "core/native/**",
  "searchkerneld/**",
  "clients/**",
  "searchkernel-web/**",
  "verification/**",
]

[[exemption]]
id = "documentation"
paths = [
  "README.md",
  "**/README.md",
  "**/AGENTS.md",
  "docs/*.md",
  "docs/**/*.md",
  "docs/*.txt",
  "docs/**/*.txt",
  "implementation-plan/*.md",
  "implementation-plan/**/*.md",
  "audits/*.md",
  "audits/**/*.md",
  ".gitignore",
  ".rgignore",
  "LICENSE*",
  "NOTICE*",
  "clients/IMPLEMENTING_NEW_CLIENTS.md",
  "clients/INTEGRATING_NEW_CLIENTS.md",
  "searchkernel-web/reference/**",
]
reason = "Documentation/reference-only material is not executable product behavior."

[[exemption]]
id = "local-metadata"
paths = [
  "clients/**/.gitignore",
  "searchkernel-web/**/.gitignore",
]
reason = "Repository metadata does not alter product execution."


