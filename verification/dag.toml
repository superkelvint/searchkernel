# SearchKernel verification DAG.
#
# This file is the semantic source of truth for verification ownership.
# It is intentionally independent of GitHub Actions, moonrepo, nextest, or any
# other execution engine.
#
# Rules:
# - new behavioral subsystems MUST be added here before they can be
#   merge-authorized;
# - unknown behavioral paths fail closed;
# - execution tools may project this DAG, but may not redefine its semantics;
# - aggregate tasks have no command and exist only to express closure.
#
# First-pass schema. Consumers must reject unknown schema_version values.

schema_version = 1
unknown_behavior = "block"
full_roots = ["full"]

# ---------------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------------

[[task]]
id = "rust-non-native"
kind = "command"
runner = "linux"
command = "cargo test --workspace --all-targets --no-default-features"
depends_on = []
cache_result = false

[[task]]
id = "rust-quality"
kind = "command"
runner = "linux"
command = "cargo fmt --all --check && cargo clippy --workspace --all-targets --no-default-features -- -D warnings"
depends_on = []
cache_result = false

[[task]]
id = "python-client"
kind = "command"
runner = "linux"
command = "./dev test python"
depends_on = []
cache_result = false

[[task]]
id = "typescript-client"
kind = "command"
runner = "linux"
command = "./dev test typescript"
depends_on = []
cache_result = false

[[task]]
id = "php-client"
kind = "command"
runner = "linux"
command = "./dev test php"
depends_on = []
cache_result = false

[[task]]
id = "protocol-generated"
kind = "command"
runner = "linux"
command = "./dev check-protocol"
depends_on = []
cache_result = false

[[task]]
id = "api-conformance"
kind = "command"
runner = "linux"
command = "./dev verify api-conformance"
depends_on = []
cache_result = false

[[task]]
id = "client-contracts"
kind = "command"
runner = "linux"
command = "./dev verify contracts"
depends_on = []
cache_result = false

[[task]]
id = "c2-historical"
kind = "command"
runner = "linux"
command = "reference/clients/c2/verify-c2.sh"
depends_on = []
cache_result = false

[[task]]
id = "abi"
kind = "command"
runner = "self-hosted-native"
command = "./dev verify abi"
depends_on = []
cache_result = false

[[task]]
id = "persistence-static"
kind = "command"
runner = "linux"
command = "tools/check-persistence-fixtures.sh"
depends_on = []
cache_result = false

[[task]]
id = "persistence-native"
kind = "command"
runner = "self-hosted-native"
command = "./dev verify persistence"
depends_on = ["persistence-static"]
cache_result = false

[[task]]
id = "native-python-e2e"
kind = "command"
runner = "self-hosted-native"
command = "tools/run-python-native-e2e.sh"
depends_on = []
cache_result = false

[[task]]
id = "vespa-m14"
kind = "command"
runner = "self-hosted-native"
command = "./dev verify m14"
depends_on = []
cache_result = false

[[task]]
id = "vespa-integration"
kind = "command"
runner = "self-hosted-native"
command = "./dev verify integration"
depends_on = []
cache_result = false

[[task]]
id = "phase10-rust-e2e"
kind = "command"
runner = "self-hosted-native"
command = "./dev verify phase10"
depends_on = []
cache_result = false

[[task]]
id = "m13-grouping-yql"
kind = "command"
runner = "self-hosted-native"
command = "reference/vespa/m13/grouping-yql/verify-grouping-yql.sh"
depends_on = []
cache_result = false

[[task]]
id = "recovery"
kind = "command"
runner = "self-hosted-native"
command = "reference/vespa/recovery/verify-recovery.sh"
depends_on = []
cache_result = false

[[task]]
